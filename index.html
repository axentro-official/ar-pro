<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-Collect Pro — إدارة التحصيل والفواتير</title>
<link rel="icon" href="enovate.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
html{scroll-behavior:smooth}
:root{--tl:#1B2F6E;--tl2:#2E4A9E;--acc:#E8112D;--bg:#f0f2f8;--card:#fff;--soft:#f6f8fd;--line:#e3e7f2;--line2:#eef1f8;--mut:#64748b;--red:#dc2626;--green:#16a34a;--dark:#101B3E;--txt:#0f172a;--subbg:rgba(255,255,255,.88)}
body.dark{--bg:#0c1226;--card:#161e3c;--soft:#1e2850;--line:#2b3765;--line2:#232d55;--mut:#9aa8cc;--red:#f87171;--green:#4ade80;--dark:#e7ecf9;--txt:#e7ecf9;--subbg:rgba(16,24,52,.92)}
body{background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:96px;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}input,select{font-family:inherit}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0d1638,#1B2F6E 55%,#31437f);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow:auto}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;animation:float 9s ease-in-out infinite;pointer-events:none}
.orb.a{width:340px;height:340px;background:#E8112D;top:-90px;right:-70px;opacity:.25}
.orb.b{width:280px;height:280px;background:#2E4A9E;bottom:-70px;left:-60px;animation-delay:-4s}
.orb.c{width:200px;height:200px;background:#E8112D;bottom:15%;right:12%;animation-delay:-7s;opacity:.2}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.07)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.login-card{background:var(--card);border-radius:22px;padding:30px 32px 18px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.35);text-align:center;animation:pop .5s;position:relative;z-index:2;margin:auto}
.co-logo{height:60px;margin:0 auto 6px;display:block;max-width:200px;object-fit:contain}
.login-card h1{font-size:23px;font-weight:900;margin-top:4px;color:var(--dark)}
.login-card .sub{color:var(--mut);font-size:13px;margin:4px 0 14px}
.login-card label{display:block;text-align:right;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 4px}
.login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--card);color:var(--txt);transition:.2s}
.login-card input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(27,47,110,.12)}
.pw{position:relative}
.pw input{padding-left:42px}
.eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--mut);padding:2px;display:flex;opacity:.7;transition:.15s}
.eye:hover{opacity:1;color:var(--tl)}
.remember{display:flex;align-items:center;gap:8px;text-align:right;margin:10px 0 4px;cursor:pointer}
.remember input{width:18px;height:18px;accent-color:#E8112D;cursor:pointer}
.remember span{font-size:12.5px;font-weight:700;color:var(--mut)}
.otpbox{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0}
.otpbox input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:900;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);transition:.15s}
.otpbox input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(27,47,110,.12)}
.stateicon{font-size:46px;margin-bottom:8px}
.lerr{color:var(--red);font-size:12.5px;font-weight:700;margin-top:10px;min-height:18px}
.login-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px}
.lf-qr{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none}
.lf-qr img{width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:2px;transition:.2s}
.lf-qr:hover img{box-shadow:0 0 0 2px var(--acc),0 0 14px rgba(232,17,45,.4)}
.lf-qr span{font-size:7.5px;color:var(--acc);font-weight:800;white-space:nowrap}
.lf-txt{text-align:right;line-height:1.6}
.lf-txt b{font-size:11px;color:var(--txt)}.lf-txt span{display:block;font-size:10px;color:var(--mut);font-weight:700}
#topbar{position:fixed;top:0;right:0;left:0;height:60px;background:linear-gradient(90deg,#101B3E,#1B2F6E);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;box-shadow:0 2px 14px rgba(16,27,62,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb-brand{display:flex;gap:10px;align-items:center;flex-shrink:0}
.lgbox{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}
.lgbox img{height:28px;max-width:86px;object-fit:contain;display:block}
.tb-brand b{color:#fff;font-size:14.5px;display:block;line-height:1.25}
.tb-brand span{font-size:10px;color:#9fb0d8;display:block}
#tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
.nitem{display:inline-flex;gap:7px;align-items:center;padding:8px 13px;border:none;background:none;color:#b6c3e2;border-radius:10px;font-size:12.8px;font-weight:700;white-space:nowrap;transition:.15s;-webkit-tap-highlight-color:transparent}
.nitem:hover{background:rgba(255,255,255,.08);color:#fff}
.nitem.active{background:linear-gradient(135deg,#E8112D,#b30d23);color:#fff;box-shadow:0 3px 10px rgba(232,17,45,.4)}
.bdg{background:rgba(255,255,255,.25);border-radius:99px;padding:1px 7px;font-size:10px;font-weight:900}
.tb-left{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-right:auto}
.conn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border-radius:99px;padding:5px 12px;font-size:11.5px;font-weight:800;color:#d7def2}
.lamp{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lamp.ok{background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite}
.lamp.bad{background:#ef4444;box-shadow:0 0 8px #ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.tb-ic{background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:15px;color:#d7def2;transition:.15s;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.tb-ic:hover{background:rgba(255,255,255,.18)}
.tb-lang{background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:12px;font-weight:900;color:#d7def2;transition:.15s}
.tb-lang:hover{background:rgba(255,255,255,.18)}
.btn-out{background:linear-gradient(135deg,#E8112D,#a30c1f);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap;box-shadow:0 3px 10px rgba(232,17,45,.35);-webkit-tap-highlight-color:transparent}
.btn-out:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-out .sm{display:none}
.avwrap{position:relative}
.avbtn{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#E8112D,#a30c1f);color:#fff;font-weight:900;font-size:15px;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.avbtn:hover{border-color:#fff}
.avbtn img{width:100%;height:100%;object-fit:cover;display:block}
.avmenu{position:absolute;top:48px;left:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(2,8,20,.3);width:230px;padding:16px;text-align:center;display:none;z-index:60;animation:pop .2s}
.avmenu.open{display:block}
.avmenu .big{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#E8112D,#a30c1f);color:#fff;font-weight:900;font-size:24px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fee2e2}
.avmenu .big img{width:100%;height:100%;object-fit:cover}
.avmenu b{display:block;font-size:14px;color:var(--txt)}
.avmenu .urole{font-size:11px;font-weight:800;color:var(--tl2)}
.avmenu .btn-ghost{width:100%;margin-top:8px}
.btn-danger{background:var(--acc);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-weight:800;font-size:13px;transition:.15s}
.btn-danger:hover{filter:brightness(1.1)}
#drawer{position:fixed;top:0;bottom:0;right:0;width:min(86vw,265px);background:linear-gradient(180deg,#101B3E,#1B2F6E);z-index:80;transform:translateX(100%);transition:.28s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.4)}
#drawer.open{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.dr-head .x{margin-right:auto}
.dr-tools{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);justify-content:center}
.dr-user{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.dr-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#E8112D,#a30c1f);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.25)}
.dr-av img{width:100%;height:100%;object-fit:cover}
.dr-user b{color:#fff;font-size:13.5px;display:block}
#drawer nav{padding:12px 10px;flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#drawer .nitem{display:flex;width:100%}
#drawer .btn-danger{margin:10px}
#scrim{display:none}
main{padding-top:60px;min-height:100vh}
#vdate{color:var(--mut);font-size:11px;font-weight:700}
.subbar{background:var(--subbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:60px;z-index:30}
.subbar h2{font-size:17px;font-weight:800;color:var(--dark)}
.sb-actions{margin-right:auto;display:flex;gap:8px;align-items:center}
.btn-primary{background:linear-gradient(135deg,#2E4A9E,#1B2F6E);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(27,47,110,.35);position:relative;overflow:hidden;transition:.15s}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--txt);transition:.15s}
.btn-ghost:hover{border-color:var(--tl);color:var(--tl2)}
.btn-sm{background:var(--soft);color:var(--tl2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;transition:.15s}
.btn-sm:hover{filter:brightness(1.08)}
.tb-act{background:var(--card);border:1.5px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:14px;color:var(--txt);transition:.15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-act:hover{border-color:var(--tl);color:var(--tl2)}
.content{padding:20px;max-width:1350px;margin:0 auto}
.view{display:none;animation:fadeUp .25s}.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(16,27,62,.06);border:1px solid var(--line);transition:box-shadow .2s}
.card:hover{box-shadow:0 8px 22px rgba(16,27,62,.1)}
.card h3{font-size:14.5px;margin-bottom:12px;color:var(--dark)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(16,27,62,.06);border:1px solid var(--line);display:flex;gap:12px;align-items:center;transition:.2s;cursor:pointer}
.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(16,27,62,.14);border-color:#c6d0ea}
.k-ic{width:44px;height:44px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.kpi.ok .k-ic{background:#dcfce7}.kpi.bad .k-ic{background:#fee2e2}
body.dark .kpi.ok .k-ic{background:#14321f}body.dark .kpi.bad .k-ic{background:#3a1420}
.k-t{font-size:11.5px;color:var(--mut);font-weight:700}
.k-v{font-size:19px;font-weight:900;line-height:1.3;color:var(--dark)}
.k-v small{font-size:11px;color:var(--mut);font-weight:600}
.kpi.ok .k-v{color:var(--green)}.kpi.bad .k-v{color:var(--red)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.chbox{height:250px;position:relative}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.inp{padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13px;background:var(--card);color:var(--txt);transition:.2s}
.inp:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px rgba(27,47,110,.1)}
.inp.q{flex:1;min-width:200px}
.grow{flex:1}
.icon-btn{background:none;border:none;font-size:15px;opacity:.6;transition:.15s;color:var(--txt)}
.icon-btn:hover{opacity:1;transform:scale(1.15)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:12px;height:12px;transform:translate(-50%,-50%);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{width:140px;height:140px;opacity:0}}
.tbl{overflow:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.8px;white-space:nowrap}
th{background:var(--soft);color:var(--txt);text-align:right;padding:10px;border-bottom:2px solid var(--line);font-size:11.5px;position:sticky;top:0;z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line2)}
tbody tr:hover td{background:var(--soft)}
tr.click{cursor:pointer}
.tot td{background:var(--soft)!important;font-weight:900;border-top:2px solid var(--line)}
.num{font-weight:700;font-variant-numeric:tabular-nums}
.ok{color:var(--green)}.bad{color:var(--red)}.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px;color:var(--mut)}
.chip{padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;display:inline-block}
.st-paid{background:#dcfce7;color:#166534}.st-open{background:#e8edf9;color:#1B2F6E}.st-late{background:#fee2e2;color:#991b1b}.st-over{background:#ede9fe;color:#6d28d9}
.st-due{background:#e8edf9;color:#44506e}
.st-g1{background:#dcfce7;color:#166534}
.st-o{background:#fed7aa;color:#9a3412}
.st-r2{background:#b91c1c;color:#fff}
body.dark .st-open,body.dark .st-due{background:#1e2850;color:#9fb0d8}
body.dark .st-paid,body.dark .st-g1{background:#14321f;color:#4ade80}
body.dark .st-late{background:#3a1420;color:#f87171}
.pbar{background:var(--line);border-radius:99px;height:8px;width:100%;min-width:90px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#E8112D,#2E4A9E);border-radius:99px;transition:width .6s}
.thmb{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;transition:.15s;vertical-align:middle}
.thmb:hover{transform:scale(1.08);border-color:var(--tl)}
.thmbrow{display:flex;gap:4px;align-items:center}
#hovp{position:fixed;z-index:300;display:none;pointer-events:none;background:var(--card);border-radius:14px;padding:8px;box-shadow:0 18px 45px rgba(2,8,20,.35);border:1px solid var(--line);max-width:420px}
#hovp img{max-width:400px;max-height:300px;border-radius:10px;display:block}
.pdffont{font-size:18px;cursor:pointer;vertical-align:middle;transition:.15s}
.pdffont:hover{transform:scale(1.2)}
.feed{max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch}
.feed-item{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line2);font-size:12.5px}
.fi-ic{width:30px;height:30px;background:var(--soft);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(13,22,56,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:30px 12px;overflow:auto}
.ov.show{display:flex}
.box{background:var(--card);border-radius:20px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:pop .25s;max-width:480px;margin:auto}
.box.wide{max-width:940px}
.box-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.box-h b{font-size:15px;color:var(--dark)}
.box-b{padding:20px}
.x{border:none;background:var(--soft);width:32px;height:32px;border-radius:9px;font-size:14px;transition:.15s;color:var(--txt);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x:hover{background:#fee2e2;color:#dc2626;transform:rotate(90deg)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--card);color:var(--txt);transition:.2s}
.field input:focus,.field select:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px rgba(27,47,110,.1)}
.field input:read-only{background:var(--soft);color:var(--tl2);font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px;color:var(--red)}
.hint{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.6}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.d-cell{background:var(--soft);border-radius:12px;padding:10px 12px}
.d-cell .l{font-size:10.5px;color:var(--mut);font-weight:700}
.d-cell .v{font-size:13.5px;font-weight:800;margin-top:2px;color:var(--dark)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats3>div{border-radius:12px;padding:12px;text-align:center;background:var(--soft)}
.stats3 b{display:block;font-size:16px;margin-top:3px;color:var(--dark)}
.stats3 .tiny{display:block}
.subh{font-size:13.5px;font-weight:800;margin:18px 0 8px;color:var(--tl2)}
.atts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.att{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.att-ic{width:40px;height:40px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;flex-shrink:0}
.att-ic img{width:100%;height:100%;object-fit:cover}
.att-n{flex:1;min-width:0;overflow:hidden}
.att-n b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.att-act{display:flex;gap:6px}
.mrow{display:flex;gap:8px;margin-top:10px}
.mrow .btn-primary,.mrow .btn-ghost{flex:1 1 0;min-width:0;margin-top:0}
/* ⭐ توست واحد نشط — بدون شريط — قصير */
#toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:400;pointer-events:none;width:min(92vw,410px)}
.tst{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:13px;padding:11px 14px;box-shadow:0 10px 30px rgba(2,8,20,.28);border:1px solid var(--line);width:100%;position:relative;overflow:hidden;cursor:pointer;animation:tstIn .22s ease-out}
.tst.out{animation:tstOut .18s ease-in forwards}
@keyframes tstIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tstOut{to{opacity:0;transform:translateY(-8px) scale(.96)}}
.tic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;color:#fff}
.tst.ok .tic{background:linear-gradient(135deg,#22c55e,#16a34a)}
.tst.err .tic{background:linear-gradient(135deg,#E8112D,#a30c1f)}
.tst.info .tic{background:linear-gradient(135deg,#2E4A9E,#1B2F6E)}
.tmsg{font-size:12.5px;font-weight:700;line-height:1.5;flex:1;color:var(--txt);word-break:break-word}
.tx{border:none;background:var(--soft);width:22px;height:22px;border-radius:6px;font-size:10px;color:var(--mut);flex-shrink:0;transition:.15s;display:flex;align-items:center;justify-content:center}
.tx:hover{background:#fee2e2;color:#dc2626}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:700;color:var(--tl)}
body.dark #loading{background:rgba(10,15,35,.82);color:#8fa8e8}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--tl2);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#foot{position:fixed;bottom:0;right:0;left:0;background:linear-gradient(180deg,rgba(16,27,62,.97),rgba(27,47,110,.98));color:#9fb0d8;display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 18px;z-index:30;border-top:1px solid rgba(255,255,255,.06);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);flex-wrap:wrap}
.ftr-txt{display:flex;flex-direction:column;align-items:center;line-height:1.5}
.ftr-txt b{color:#e6eaf6;font-size:12px;font-weight:800}.ftr-txt span{font-size:10.5px}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;transition:.25s;flex-shrink:0}
.qr-wrap img{width:56px;height:56px;border-radius:10px;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(232,17,45,.35);transition:.25s}
.qr-wrap:hover{transform:translateY(-3px)}
.qr-wrap:hover img{box-shadow:0 0 0 2px #E8112D,0 0 22px rgba(232,17,45,.55)}
.qr-wrap span{font-size:8.5px;color:#ff8fa0;font-weight:800;letter-spacing:.4px;white-space:nowrap}
.stmt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:3px solid var(--dark);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
.stmt-head img{height:52px;max-width:210px;object-fit:contain}
.stmt-head .t1{font-size:21px;font-weight:900;color:var(--dark)}
.stmt-head .t2{font-size:12px;color:var(--mut);font-weight:700;line-height:1.7}
.stmt-meta{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;line-height:1.8}
.sig-row{display:flex;gap:50px;margin-top:30px;flex-wrap:wrap}
.sig{flex:1;min-width:200px;text-align:center}
.sig .line{border-top:1.5px solid var(--mut);margin-top:44px;padding-top:6px;font-size:12px;font-weight:800;color:var(--txt)}
.stmt-note{margin-top:16px;font-size:10.5px;color:var(--mut);text-align:center;border-top:1px dashed var(--line);padding-top:8px}
@media print{@page{size:A4;margin:12mm}#topbar,.subbar,#drawer,.noprint,#toasts,#foot,#loading,.ov{display:none!important}body,body.dark{padding:0;background:#fff!important;color:#0f172a!important}main{padding-top:0}.view{display:none!important}#v-stmt{display:block!important}.card,body.dark .card{box-shadow:none;border:1px solid #ddd;border-radius:8px;background:#fff!important}body.dark{--dark:#101B3E;--mut:#64748b;--txt:#0f172a;--soft:#f6f8fd;--line:#e3e7f2;--line2:#eef1f8}th,body.dark th{background:#f6f8fd!important;color:#44506e!important}}
.burger{display:none;background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:17px;color:#d7def2}
@media(max-width:1080px){.nitem{padding:8px 9px;font-size:12px}}
@media(max-width:920px){
 #tabs{display:none}.burger{display:block}.conn span:last-child{display:none}
 .subbar{top:60px;padding:8px 14px}.grid-2{grid-template-columns:1fr}.stats3{grid-template-columns:1fr}
 #foot{gap:12px;padding:6px 10px}.ftr-txt b{font-size:10px}.qr-wrap img{width:46px;height:46px}
 .btn-out .lg{display:none}.btn-out .sm{display:inline}.btn-out{padding:8px 12px}
 .content{padding:14px 12px}
 .login-card input,.field input,.field select,.inp{font-size:16px}
 .otpbox input{width:38px;height:46px;font-size:18px}
 .login-card{padding:22px 16px 14px}
}
@media(min-width:921px){.btn-out .sm{display:none}#drawer{display:none}}
@media(max-width:480px){
 .login-card h1{font-size:19px}
 .subbar h2{font-size:15px}
 #drawer{width:min(88vw,265px)}
 .card{padding:14px}
 .k-v{font-size:17px}
 #foot{gap:10px;padding:6px 8px}
 .tmsg{font-size:12px}
}
#scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70}
</style>
</head>

function startLive(){
  if(LIVE)return;LIVE=true;
  db.collection('invoices').onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==='removed')delete RAW.inv[ch.doc.id];else RAW.inv[ch.doc.id]=ch.doc.data();});rebuild();});
  db.collection('transactions').onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==='removed')delete RAW.tx[ch.doc.id];else RAW.tx[ch.doc.id]=ch.doc.data();});rebuild();});
  db.collection('customers').onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==='removed')delete RAW.cust[ch.doc.id];else RAW.cust[ch.doc.id]=ch.doc.data();});rebuild();});
  db.collection('logs').orderBy('ts','desc').limit(300).onSnapshot(s=>{RAW.logs={};s.forEach(d=>RAW.logs[d.id]=d.data());rebuild();});
  db.collection('settings').doc('company').onSnapshot(doc=>{D.company=doc.data()||{};applyData();});
}
function rebuild(){
  const invoices=[];const today=new Date();today.setHours(0,0,0,0);
  Object.values(RAW.inv).forEach(r=>{
    const txs=Object.values(RAW.tx).filter(t=>t.invNo===r.invNo).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
    const amount=Number(r.amount)||0,collected=txs.reduce((s,t)=>s+(Number(t.amount)||0),0),remaining=amount-collected;
    let overdue=null;
    if(r.dueDate&&remaining>0.005){const due=new Date(r.dueDate+'T00:00:00');if(!isNaN(due))overdue=Math.floor((today-due)/86400000);}
    invoices.push({invNo:r.invNo,customer:r.customer||'',invDate:r.invDate||'',dueDate:r.dueDate||'',amount:amount,
      taxRate:Number(r.taxRate)||0,notes:r.notes||'',createdAt:r.createdAt||'',createdBy:r.createdBy||'',
      project:r.project||'',desc:r.desc||'',beforeTax:Number(r.beforeTax)||0,
      taxAmount:(r.beforeTax>0?Math.round((amount-r.beforeTax)*100)/100:0),
      txs:txs,collected:collected,remaining:remaining,pct:amount>0?Math.min(collected/amount*100,100):0,
      overdue:overdue,bucket:bucket_(overdue)});
  });
  D.invoices=invoices;
  D.customers=Object.keys(RAW.cust).sort();
  D.logs=Object.values(RAW.logs).sort((a,b)=>((b.ts&&b.ts.seconds)||0)-((a.ts&&a.ts.seconds)||0)).slice(0,300);
  saveCache();applyData();
  if($('topbar').style.display!=='none')render();
}
function bucket_(d){if(d===null||d===undefined)return '';
  if(d<=0)return 'b0';if(d<=30)return 'b30';if(d<=60)return 'b60';
  if(d<=90)return 'b90';if(d<=180)return 'b180';if(d<=360)return 'b360';return 'b365';}
function bkLb(b){return b?t('bk_'+b):'';}
function log_(user,action,detail,invNo){db.collection('logs').add({ts:new Date(),user:user||'—',action:action||'',detail:detail||'',invNo:invNo||''});}

async function uploadAvatarFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>5*1024*1024){toast(t('avBig'),'err');inp.value='';return;}
  if(!busyGate())return;
  try{
    const cf=await compressImage(f,400);
    const m=await svc('uploadMedia',{name:'avatar-'+ME.email,type:cf.type,data:await fileToB64(cf)});
    ME.avatarId=m.id;
    await db.collection('users').doc(ME.email).update({avatarId:m.id});
    toast(t('avUpd'),'ok');applyAvatars();
  }catch(e){toast(e.message,'err');}
  inp.value='';busyRel();
}

    try{ME.avatarId='';await db.collection('users').doc(ME.email).update({avatarId:''});toast(t('avDel'),'ok');applyAvatars();}catch(e){toast(e.message,'err');}

function statusOf(v){
  if(v.remaining<-0.005)return{k:'over'};
  if(v.remaining<=0.005)return{k:'paid'};
  if(v.overdue!=null&&v.overdue>0)return{k:'late'};
  return{k:'open'};}
function stTxt(v){const k=statusOf(v).k;if(k==='over')return t('stOverP')+fmt(-v.remaining);return t('st'+k.charAt(0).toUpperCase()+k.slice(1));}
function chipStatus(v){return '<span class="chip st-'+statusOf(v).k+'">'+stTxt(v)+'</span>';}
function delayChip(v){
  if(v.overdue==null)return '<span class="chip st-due">'+t('stDueN')+'</span>';
  if(v.overdue<=0){const left=Math.abs(v.overdue);return '<span class="chip st-g1">'+(left===0?t('dToday'):t('dFuture',{n:left}))+'</span>';}
  const cls=v.overdue<=60?'st-g1':(v.overdue<=180?'st-o':'st-r2');
  const ic=v.overdue<=60?'🟢':(v.overdue<=180?'🟠':'🔴');
  return '<span class="chip '+cls+'">'+t('dLateD',{ic:ic,n:v.overdue})+'</span>';
}
function kpi(tt,v,ic,cls,nav){return '<div class="kpi '+(cls||'')+'"'+(nav?(' onclick="navTo(\''+nav+'\')"'):'')+'><div class="k-ic">'+ic+'</div><div><div class="k-t">'+tt+'</div><div class="k-v">'+v+'</div></div></div>';}
function feedIcon(a){if(a.indexOf('حذف')===0)return'🗑️';if(a.indexOf('إضافة فاتورة')===0)return'🧾';if(a.indexOf('تعديل')===0)return'✏️';if(a.indexOf('دفعة')>-1)return'💵';if(a.indexOf('حركة')===0)return'🔖';if(a.indexOf('عميل')>-1)return'👤';if(a.indexOf('شعار')>-1)return'🖼️';if(a.indexOf('الصورة')>-1)return'📷';if(a.indexOf('استيراد')===0)return'📥';if(a.indexOf('استحواذ')>-1)return'⭐';if(a.indexOf('النظام')===0)return'⭐';return'📌';}
function fmtTs(ts){if(!ts)return'';try{const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString(loc(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function feed(list){return list.map(l=>'<div class="feed-item"><span class="fi-ic">'+feedIcon(l.action)+'</span><div><b>'+esc(l.action)+'</b> <span class="tiny">'+esc(l.detail)+'</span><br><span class="tiny mut">'+fmtTs(l.ts)+' — '+esc(l.user)+'</span></div></div>').join('');}
function dcell(l,v){return '<div class="d-cell"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function attThumbs(tx){
  const atts=(tx.atts||[]);
  if(!atts.length)return '<span class="mut tiny">—</span>';
  let h='<div class="thmbrow">';
  atts.forEach(a=>{
    if(/^image\//.test(a.type||'')){
      h+='<img class="thmb" loading="lazy" src="'+imgSrc(a.id)+'" data-big="'+imgSrc(a.id)+'" onmouseenter="hovShow(this,\''+esc(a.name)+'\')" onmouseleave="hovHide()" onclick="event.stopPropagation();openMedia(\''+a.id+'\',\''+esc(a.name)+'\',\''+(a.type||'')+'\')">';
    }else if(a.type==='application/pdf'){
      h+='<span class="pdffont" title="'+esc(a.name)+'" onclick="event.stopPropagation();window.open(\''+dlSrc(a.id)+'\',\'_blank\')">📄</span>';
    }else{
      h+='<span class="pdffont" title="⬇️" onclick="event.stopPropagation();window.open(\''+dlSrc(a.id)+'\',\'_blank\')">📁</span>';
    }
  });
  if(atts.length>3)h+='<span class="tiny mut">+'+(atts.length-3)+'</span>';
  return h+'</div>';
}
function hovShow(el,name){const p=$('hovp');p.innerHTML='<img src="'+el.dataset.big+'"><div class="tiny mut" style="text-align:center;margin-top:4px;font-weight:700">'+esc(name)+'</div>';p.style.display='block';const r=el.getBoundingClientRect();let top=r.bottom+8,left=Math.min(r.left,window.innerWidth-440);if(r.bottom+330>window.innerHeight)top=r.top-320;p.style.top=Math.max(8,top)+'px';p.style.left=Math.max(8,left)+'px';}
function hovHide(){$('hovp').style.display='none';}

   kpi(t('kLate'),fmt(lateAmt)+' <small>ج.م</small>','🔥','bad','rep')+

   (late.length?late.map(v=>'<tr class="click" onclick="openDetail(\''+esc(v.invNo)+'\')"><td><b>'+esc(v.invNo)+'</b></td><td>'+esc(v.customer)+'</td><td>'+(v.dueDate||'—')+'</td><td>'+delayChip(v)+'</td><td class="num bad">'+fmt(v.remaining)+'</td></tr>').join(''):'<tr><td colspan="5" class="mut small">'+t('noLate')+'</td></tr>')+

  drawAging(invs,'chAging');drawMonth(invs,'chMonth');

function drawAging(invs,id){
  const data=BUCKETS.map(b=>invs.reduce((s,v)=>s+((v.remaining>0.005&&v.bucket===b)?v.remaining:0),0));
  const el=$(id);if(!el)return;if(chA)chA.destroy();
  chA=new Chart(el,{type:'bar',data:{labels:BUCKETS.map(bkLb),datasets:[{data:data,backgroundColor:['#94a3b8','#7ea0e8','#2E4A9E','#1B2F6E','#E8112D','#a30c1f','#5b101c'],borderRadius:8}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>fmt(x.raw)+' EGP'}}},scales:{y:{ticks:{callback:v=>fmt0(v)}}}}});
}
function drawMonth(invs,id){
  const now=new Date();now.setDate(1);const labels=[],invD=[],colD=[];
  for(let i=5;i>=0;i--){const x=new Date(now);x.setMonth(now.getMonth()-i);
    const key=x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2);
    labels.push(('0'+(x.getMonth()+1)).slice(-2)+'/'+x.getFullYear());
    invD.push(invs.reduce((s,v)=>s+((v.invDate||'').indexOf(key)===0?v.amount:0),0));
    colD.push(invs.reduce((s,v)=>s+v.txs.reduce((s2,tx)=>s2+((tx.type==='دفعة'&&(tx.date||'').indexOf(key)===0)?tx.amount:0),0),0));}
  const el=$(id);if(!el)return;if(chM)chM.destroy();
  chM=new Chart(el,{type:'bar',data:{labels:labels,datasets:[{label:t('navInv'),data:invD,backgroundColor:'#1B2F6E',borderRadius:6},{label:t('kCollected'),data:colD,backgroundColor:'#E8112D',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:x=>x.dataset.label+': '+fmt(x.raw)+' EGP'}}},scales:{y:{ticks:{callback:v=>fmt0(v)}}}}});
}

function invFiltered(){
  const f=F.inv,q=f.q.trim().toLowerCase();
  return D.invoices.filter(v=>{
    if(f.cust&&v.customer!==f.cust)return false;
    const s=statusOf(v).k;
    if(f.st&&s!==f.st)return false;
    if(f.bk&&v.bucket!==f.bk)return false;
    if(q){const hay=(v.invNo+' '+v.customer+' '+(v.project||'')+' '+(v.desc||'')+' '+v.notes+' '+v.txs.map(tx=>(tx.ref||'')+' '+(tx.method||'')+' '+(tx.notes||'')).join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;}).sort((a,b)=>(a.invDate||'9999')<(b.invDate||'9999')?1:-1);
}

  const rows=invFiltered();

  :'<tr><td colspan="13" style="text-align:center;padding:30px" class="mut">'+t('noMatch')+'</td></tr>')+
  '<tr class="tot"><td colspan="5">'+t('totInv',{n:rows.length})+'</td><td class="num">'+fmt(sA)+'</td><td></td><td class="num">'+fmt(sC)+'</td><td class="num">'+fmt(sR)+'</td><td colspan="4"></td></tr>'+
  '</tbody></table>';
}
function exportInvCSV(){
  const rows=invFiltered();
  dlCSV('invoices.csv',[['Invoice','Customer','Project','Description','Invoice date','Due date','Before tax','Tax %','Total','Collected','Remaining','Status','Delay']]
    .concat(rows.map(v=>[v.invNo,v.customer,v.project||'',v.desc||'',v.invDate||'',v.dueDate||'',v.beforeTax||'',v.taxRate||'',v.amount,v.collected,v.remaining,stTxt(v),v.overdue!=null?v.overdue:''])));
}
function dlCSV(name,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();
}
function openInvForm(invNo){
  editInv=!!invNo;$('i_err').textContent='';
  $('i_title').textContent=editInv?t('mInvEdit',{n:invNo}):t('mInvNew');
  $('i_no').value=invNo||'';$('i_no').disabled=editInv;
  $('custList').innerHTML=D.customers.map(c=>'<option value="'+esc(c)+'">').join('');
  let v=null;if(editInv)v=D.invoices.find(x=>x.invNo===invNo);
  $('i_cust').value=v?v.customer:'';
  $('i_project').value=v?(v.project||''):'';
  $('i_desc').value=v?(v.desc||''):'';
  $('i_idate').value=v?(v.invDate||''):todayStr();
  $('i_ddate').value=v?(v.dueDate||''):'';

async function submitInv(){
  if(!busyGate())return;
  const btn=$('i_save');btn.disabled=true;
  const b=Number($('i_before').value)||0,r=Number($('i_rate').value)||0;
  const total=b>0?Math.round(b*(1+r/100)*100)/100:Number($('i_total').value)||0;
  const invNo=$('i_no').value.trim().replace(/[\/\\'"]/g,'-');
  const d={invNo:invNo,customer:$('i_cust').value.trim(),project:$('i_project').value.trim(),desc:$('i_desc').value.trim(),
    invDate:$('i_idate').value,dueDate:$('i_ddate').value,beforeTax:b,taxRate:r,amount:total,notes:$('i_notes').value};
  try{
    if(!d.invNo)throw new Error(t('eInvNo'));
    if(!d.customer)throw new Error(t('eInvCust'));
    if(total<=0)throw new Error(t('eInvAmt'));
    if(editInv){
      const old=D.invoices.find(x=>x.invNo===invNo);
      const ch=[];
      if(old){
        if(old.customer!==d.customer)ch.push(t('thCust')+' ('+old.customer+' ← '+d.customer+')');
        if((old.invDate||'')!==d.invDate)ch.push(t('thIDate')+' ('+(old.invDate||'—')+' ← '+(d.invDate||'—')+')');
        if((old.dueDate||'')!==d.dueDate)ch.push(t('thDDate')+' ('+(old.dueDate||'—')+' ← '+(d.dueDate||'—')+')');
        if(old.amount!==total)ch.push(t('thTot')+' ('+fmt(old.amount)+' ← '+fmt(total)+')');
        if(old.taxRate!==r)ch.push(t('fRate')+' ('+old.taxRate+'% ← '+r+'%)');
        if((old.beforeTax||0)!==b)ch.push(t('fBefore')+' ('+fmt(old.beforeTax||0)+' ← '+fmt(b)+')');
        if((old.project||'')!==d.project)ch.push(t('fProj')+' ('+(old.project||'—')+' ← '+(d.project||'—')+')');
        if((old.desc||'')!==d.desc)ch.push(t('fDesc')+' ('+(old.desc||'—')+' ← '+(d.desc||'—')+')');
        if((old.notes||'')!==d.notes)ch.push(t('fNotes'));
      }
      await db.collection('invoices').doc(invNo).set(d,{merge:true});
      if(!D.customers.includes(d.customer))await db.collection('customers').doc(d.customer).set({name:d.customer});
      log_(ME.name,'تعديل فاتورة',invNo+' — '+d.customer+(ch.length?(' — التغييرات: '+ch.join('؛ ')):' — بدون تغييرات'),invNo);
      closeOv('m_inv');toast(t('invEdited'),'ok');
    }else{
      if(D.invoices.some(x=>x.invNo===invNo))throw new Error(t('eInvDup',{n:invNo}));
      await db.collection('invoices').doc(invNo).set(Object.assign({},d,{createdAt:todayStr(),createdBy:ME.name,cid:invCidV}));
      if(!D.customers.includes(d.customer))await db.collection('customers').doc(d.customer).set({name:d.customer});
      log_(ME.name,'إضافة فاتورة',invNo+' — '+d.customer+(d.project?(' — '+d.project):'')+' — إجمالي '+fmt(total),invNo);
      closeOv('m_inv');toast(t('invSaved'),'ok');
    }
  }catch(e){$('i_err').textContent=e.message;}
  btn.disabled=false;busyRel();
}

async function uploadLogoFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>3*1024*1024){toast(t('eLogoBig'),'err');inp.value='';return;}
  if(!busyGate())return;
  try{
    const m=await svc('uploadMedia',{name:'company-logo',type:f.type||'image/png',data:await fileToB64(f)});
    await db.collection('settings').doc('company').set({logoId:m.id},{merge:true});
    toast(t('logoUpd'),'ok');
  }catch(e){toast(e.message,'err');}
  inp.value='';busyRel();
}

async function migrateOld(){
  if(!busyGate())return;
  const key=$('mig_key').value.trim();
  if(!key){toast(t('migKey'),'err');busyRel();return;}
  const btn=$('mig_btn');btn.disabled=true;
  try{
    if(D.invoices.length)throw new Error(t('eHasData'));
    toast(t('migRead'),'info');
    const r=await fetch(SVC_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'exportAll',key:key,svcKey:(typeof SVC_KEY!=='undefined'?SVC_KEY:'')})});
    const txt=await r.text();let res;
    try{res=JSON.parse(txt);}catch(e){throw new Error(t('svcErr',{s:r.status}));}
    if(!res.ok)throw new Error(res.error||'Export failed');
    const data=res.data;
    async function put(col,docs){
      for(let i=0;i<docs.length;i+=400){
        const batch=db.batch();
        docs.slice(i,i+400).forEach(d=>{
          const id=col==='invoices'?String(d.invNo).replace(/[\/\\'"]/g,'-'):(col==='customers'?d.name:d.id);
          batch.set(db.collection(col).doc(id),d);
        });
        await batch.commit();
        toast(t('migStep',{n:(i+Math.min(400,docs.length-i))}),'info');
      }
    }
    await put('invoices',data.invoices||[]);
    await put('transactions',data.transactions||[]);
    await put('customers',data.customers||[]);
    if(data.company&&(data.company.name||data.company.logoId))await db.collection('settings').doc('company').set(data.company,{merge:true});
    log_(ME.name,'استيراد بيانات',t('migLog',{i:(data.invoices||[]).length,t:(data.transactions||[]).length}));
    toast(t('migDone'),'ok');
  }catch(e){toast(e.message,'err');}
  btn.disabled=false;busyRel();
}
async function wipeAllData(){
  for(const col of ['invoices','transactions','customers','logs']){
    let snap=await db.collection(col).limit(450).get();
    while(!snap.empty){
      const batch=db.batch();
      snap.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      snap=await db.collection(col).limit(450).get();
    }
  }
}

function tafqitAr(n){
  n=Math.abs(Number(n)||0);n=Math.round(n*100)/100;
  const whole=Math.floor(n),frac=Math.round((n-whole)*100);
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function u100(x){if(x<20)return ones[x];const tn=Math.floor(x/10),o=x%10;return o?ones[o]+' و'+tens[tn]:tens[tn];}
  function u1000(x){const h=Math.floor(x/100),r=x%100;let s='';if(h)s=hund[h];if(r)s+=(s?' و':'')+u100(r);return s;}
  function grp(x,one,two,pl){if(!x)return'';if(x===1)return one;if(x===2)return two;if(x<=10)return u1000(x)+' '+pl;return u1000(x)+' '+one;}
  const b=Math.floor(whole/1e9),m=Math.floor(whole/1e6)%1000,th=Math.floor(whole/1e3)%1000,u=whole%1000;
  const parts=[];
  if(b)parts.push(grp(b,'مليار','ملياران','مليارات'));
  if(m)parts.push(grp(m,'مليون','مليونان','ملايين'));
  if(th)parts.push(grp(th,'ألف','ألفان','آلاف'));
  if(u)parts.push(u1000(u));
  const txt=parts.length?parts.join(' و'):'صفر';
  let out='فقط '+txt+' جنيه مصري';
  if(frac>0)out+=' و'+u100(frac)+' قرشًا';
  return out+' لا غير.';
}
function numWordsEn(n){
  n=Math.abs(Number(n)||0);n=Math.round(n*100)/100;
  const whole=Math.floor(n),frac=Math.round((n-whole)*100);
  const o=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tt=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function u100(x){if(x<20)return o[x];const tn=Math.floor(x/10),un=x%10;return un?o[un]+'-'+tt[tn]:tt[tn];}
  function u1000(x){const h=Math.floor(x/100),r=x%100;let s='';if(h)s=o[h]+' hundred';if(r)s+=(s?' and ':'')+u100(r);return s;}
  const bi=Math.floor(whole/1e9),mi=Math.floor(whole/1e6)%1000,th=Math.floor(whole/1e3)%1000,u=whole%1000;
  const parts=[];
  if(bi)parts.push(u1000(bi)+' billion');
  if(mi)parts.push(u1000(mi)+' million');
  if(th)parts.push(u1000(th)+' thousand');
  if(u)parts.push(u1000(u));
  let s=parts.length?parts.join(' '):'zero';s=s.charAt(0).toUpperCase()+s.slice(1);
  let out='Only '+s+' Egyptian Pounds';
  if(frac>0)out+=' and '+u100(frac)+' Piasters';
  return out+'.';
}

  const addr=ar?(D.company.addrAr||''):(D.company.addrEn||'');
  const num=fmt(s.rem);
  const words=ar?tafqitAr(s.rem):numWordsEn(s.rem);
  const T=function(a,e){return ar?a:e;};
  let h='<!DOCTYPE html><html dir="'+(ar?'rtl':'ltr')+'" lang="'+(ar?'ar':'en')+'"><head><meta charset="utf-8"><title>'+T('تأكيد رصيد — '+curCust,'Balance Confirmation — '+curCust)+'</title>';
  h+='<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">';
  h+='<style>@page{size:A4;margin:16mm}body{font-family:Cairo,Arial,sans-serif;color:#141414;font-size:13.5px;line-height:2}.lh{text-align:center;border-bottom:3px solid #101B3E;padding-bottom:10px;margin-bottom:6px}.lh img{height:52px;max-width:170px;object-fit:contain;display:block;margin:0 auto 4px}.lh .co{font-weight:900;font-size:16px;color:#101B3E;line-height:1.5}.lh .addr{font-size:9.5px;color:#555;font-weight:700}h2{text-align:center;font-size:15px;margin:14px 0 4px;text-decoration:underline;color:#101B3E}.meta{font-size:13px;line-height:2.1}.red{color:#c1121f;font-weight:900}.amt{text-align:center;margin:12px 0}.amt .n{font-size:18px}.box{border:1.5px solid #333;border-radius:4px;padding:10px 16px;margin:12px 0;font-size:12.5px;line-height:2.2}.sig{display:flex;gap:60px;margin-top:34px}.sig>div{flex:1;text-align:center}.sig .l{border-top:1.2px solid #333;margin-top:46px;padding-top:6px;font-size:12px;font-weight:800}.sig .s{font-size:10px;color:#666}.foot{margin-top:22px;text-align:center;font-size:9.5px;color:#888;border-top:1px dashed #bbb;padding-top:7px}</style></head><body>';
  h+='<div class="lh"><img src="'+logoAbs()+'"><div class="co">'+esc(coName)+'</div><div class="addr">'+esc(addr)+'</div></div>';
  h+='<h2>'+T('كشف حساب — تأكيد رصيد ومطابقة أرصدة','Accounts Receivable — Statement of Account & Balance Confirmation')+'</h2>';
  h+='<div class="meta">'+T('التاريخ: ','Date: ')+'<b>'+todayStr()+'</b></div>';
  h+='<div class="meta">'+T('عزيزي العميل الكريم /','Dear / ')+' <b>'+esc(curCust)+'</b></div>';
  h+='<p>'+T('أولًا بدون إخلال بالذمة المالية، وبناءً على سجلاتنا المحاسبية، نود الإفادة بأن إجمالي المبالغ المستحقة عليكم لدى شركتنا حتى تاريخ <b>'+s.asOf+'</b> عن الفواتير المستحقة غير المسددة هي كما يلي:','First, without any prejudice to our financial position, and based on our accounting records, we hereby confirm that the total outstanding balance due to us as of <b>'+s.asOf+'</b> for unpaid invoices amounts to:')+'</p>';
  h+='<div class="amt"><div class="n red">'+(ar?('('+num+') جنيه مصري'):('(EGP '+num+')'))+'</div><div class="red" style="font-size:12.5px">'+words+'</div></div>';
  h+='<p>'+T('هذا الخطاب <b>ليس طلبًا للسداد</b> — بل مطابقة أرصدة. نرجو التكرم بالاطلاع على البيانات أعلاه، والإقرار بصحتها، أو إعلامنا بأي اختلافات تراها لديكم مع إرفاق كشف حسابكم التفصيلي، وذلك خلال مدة لا تتجاوز 15 يومًا من تاريخه.','This letter is <b>not a request for payment</b>. Kindly review the above statement, confirm its accuracy, or advise us of any differences you may find, enclosing your detailed statement, within 15 days from its date.')+'</p>';
  h+='<div class="box">'+T('☐ المعلومات المذكورة أعلاه صحيحة.<br>☐ لا أقر بالبيانات المذكورة أعلاه — أرفق كشف حسابنا التفصيلي.<br>ملاحظات / تفاصيل الاختلافات، إن وجدت: ..........................................................................................','( ) The information stated above is correct.<br>( ) Not correct — (Please give details of differences, if any): .....................................................................')+'</div>';
  h+='<p>'+T('شاكرين لكم حسن تعاونكم.','With best regards,')+'</p>';
  h+='<div class="sig"><div><div class="l">'+T('توقيع وشعار الشركة','Letter Originator')+'</div><div class="s">'+T('الاسم / المسمى الوظيفي / التاريخ','Company / Signature / Title / Date')+'</div></div><div><div class="l">'+T('توقيع العميل — بالاطلاع والموافقة','Client Signature — Reviewed & Confirmed')+'</div><div class="s">'+T('الاسم / المسمى الوظيفي / الختم / التاريخ','Name / Title / Stamp / Date')+'</div></div></div>';

  h+='<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print()},900)}<\/scr'+'ipt></body></html>';
  const w=window.open('','_blank');
  if(!w){toast(t('popBlocked'),'err');return;}
  w.document.open();w.document.write(h);w.document.close();
}
function askConfirm(title,msg,btn,danger,cb,reqText){
  $('c_title').textContent=title;$('c_msg').innerHTML=msg;
  $('c_ok').textContent=btn;$('c_ok').className=danger?'btn-danger':'btn-primary';
  $('c_input_row').style.display=reqText?'block':'none';
  $('c_label').textContent=reqText?t('confType',{w:reqText}):t('confTypeP');
  $('c_input').value='';$('c_err').textContent='';
  confCb=cb;confReq=reqText||'';openOv('m_confirm');
}
function confOk(){
  if(confReq&&$('c_input').value.trim()!==confReq){$('c_err').textContent=t('confErr',{w:confReq});return;}
  closeOv('m_confirm');if(confCb)confCb();
}

  applyTheme();applyLang();

  boot();
})();
