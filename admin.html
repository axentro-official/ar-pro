<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-Collect Admin — إدارة الأجهزة والمستخدمين</title>
<link rel="icon" href="enovate.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
:root{--tl:#1B2F6E;--tl2:#2E4A9E;--acc:#E8112D;--bg:#f0f2f8;--card:#fff;--soft:#f6f8fd;--line:#e3e7f2;--mut:#64748b;--txt:#0f172a;--head:#101B3E;--subbg:rgba(255,255,255,.88)}
body.dark{--bg:#0c1226;--card:#161e3c;--soft:#1e2850;--line:#2b3765;--mut:#9aa8cc;--txt:#e7ecf9;--head:#e7ecf9;--subbg:rgba(16,24,52,.92)}
body{background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:96px;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0d1638,#1B2F6E 55%,#31437f);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;animation:float 9s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#E8112D;top:-90px;right:-70px;opacity:.25}
.orb.b{width:280px;height:280px;background:#2E4A9E;bottom:-70px;left:-60px;animation-delay:-4s}
.orb.c{width:200px;height:200px;background:#E8112D;bottom:15%;right:12%;animation-delay:-7s;opacity:.2}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.07)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.login-card{background:var(--card);border-radius:22px;padding:30px 32px 18px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.35);text-align:center;animation:pop .5s;position:relative;z-index:2}
.co-logo{height:60px;margin:0 auto 6px;display:block;max-width:200px;object-fit:contain}
.login-card h1{font-size:22px;font-weight:900;margin-top:4px;color:var(--head)}
.login-card .sub{color:var(--mut);font-size:13px;margin:4px 0 16px}
.login-card label{display:block;text-align:right;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 4px}
.login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--card);color:var(--txt);transition:.2s}
.login-card input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(27,47,110,.12)}
.otpbox{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0}
.otpbox input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:900;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);transition:.15s}
.otpbox input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(27,47,110,.15)}
.err{color:#dc2626;font-size:12.5px;font-weight:700;margin-top:10px;min-height:18px}
body.dark .err{color:#f87171}
.okmsg{color:#16a34a;font-size:12.5px;font-weight:700;margin-top:10px;min-height:18px}
body.dark .okmsg{color:#4ade80}
.msg{color:#dc2626;font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px}
body.dark .msg{color:#f87171}
.btn-primary{background:linear-gradient(135deg,#2E4A9E,#1B2F6E);color:#fff;border:none;border-radius:11px;padding:11px;font-weight:800;font-size:13.5px;width:100%;margin-top:12px;position:relative;overflow:hidden;transition:.15s;box-shadow:0 4px 12px rgba(27,47,110,.35)}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:9px;font-weight:700;font-size:12.5px;color:var(--txt);width:100%;margin-top:8px;transition:.15s}
.btn-ghost:hover{border-color:var(--tl);color:var(--tl)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:12px;height:12px;transform:translate(-50%,-50%);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{width:140px;height:140px;opacity:0}}
.login-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px}
.lf-qr{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none}
.lf-qr img{width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:2px;transition:.2s}
.lf-qr:hover img{box-shadow:0 0 0 2px var(--acc),0 0 14px rgba(232,17,45,.4)}
.lf-qr span{font-size:7.5px;color:var(--acc);font-weight:800;white-space:nowrap}
.lf-txt{text-align:right;line-height:1.6}
.lf-txt b{font-size:11px;color:var(--txt)}.lf-txt span{display:block;font-size:10px;color:var(--mut);font-weight:700}
#topbar{position:fixed;top:0;right:0;left:0;height:60px;background:linear-gradient(90deg,#101B3E,#1B2F6E);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;box-shadow:0 2px 14px rgba(16,27,62,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb-brand{display:flex;gap:10px;align-items:center;flex-shrink:0}
.lgbox{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}
.lgbox img{height:28px;max-width:86px;object-fit:contain;display:block}
.tb-brand b{color:#fff;font-size:14.5px;display:block;line-height:1.25}
.tb-brand span{font-size:10px;color:#9fb0d8;display:block}
#tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
.nitem{display:inline-flex;gap:7px;align-items:center;padding:8px 13px;border:none;background:none;color:#b6c3e2;border-radius:10px;font-size:12.8px;font-weight:700;white-space:nowrap;transition:.15s;-webkit-tap-highlight-color:transparent}
.nitem:hover{background:rgba(255,255,255,.08);color:#fff}
.nitem.active{background:linear-gradient(135deg,#E8112D,#b30d23);color:#fff;box-shadow:0 3px 10px rgba(232,17,45,.4)}
.tb-left{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-right:auto}
.tb-ic{background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:15px;color:#d7def2;transition:.15s;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.tb-ic:hover{background:rgba(255,255,255,.18)}
.tb-lang{background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:12px;font-weight:900;color:#d7def2;transition:.15s}
.tb-lang:hover{background:rgba(255,255,255,.18)}
.btn-out{background:linear-gradient(135deg,#E8112D,#a30c1f);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap;box-shadow:0 3px 10px rgba(232,17,45,.35);-webkit-tap-highlight-color:transparent}
.btn-out:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-out .sm{display:none}
.subbar{background:var(--subbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:60px;z-index:30}
.subbar h2{font-size:17px;font-weight:800;color:var(--head)}
.sb-actions{margin-right:auto;display:flex;gap:8px;align-items:center}
.tb-act{background:var(--card);border:1.5px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:14px;color:var(--txt);transition:.15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-act:hover{border-color:var(--tl);color:var(--tl)}
#app{padding-top:60px}
.wrap{max-width:1150px;margin:0 auto;padding:16px 20px 40px}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--line);margin-bottom:12px;box-shadow:0 1px 3px rgba(16,27,62,.06);transition:box-shadow .2s,transform .2s;animation:pop .25s}
.card:hover{box-shadow:0 8px 22px rgba(16,27,62,.12);transform:translateY(-2px)}
.dev{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dev .ic{width:48px;height:48px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.dev .inf{flex:1;min-width:220px}
.nm{font-size:14.5px;font-weight:900;color:var(--head);word-break:break-word}
.em{font-size:12px;color:var(--tl2);font-weight:700;direction:ltr;text-align:right;word-break:break-all}
.meta{font-size:11px;color:var(--mut);margin-top:4px}
.strow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px;padding:10px;background:var(--soft);border-radius:12px;border:1px solid var(--line)}
.g4 .l{font-size:9.5px;color:var(--mut);font-weight:800;display:flex;align-items:center;gap:4px}
.g4 .v{font-size:11.5px;font-weight:800;color:var(--head);margin-top:2px;direction:ltr;text-align:right;word-break:break-all;white-space:normal;line-height:1.4}
/* ⭐ صف كلمة المرور: العين جنب النقط — ثابتة مطلقًا (بدون absolute) */
.pwrow{display:flex;align-items:center;gap:6px;direction:ltr;justify-content:flex-start}
.eye-in{border:none;background:none;color:var(--mut);padding:3px;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:.15s;flex-shrink:0}
.eye-in:hover{color:var(--tl);background:var(--soft)}
.chip{padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;display:inline-block}
.c-pend{background:#fef3c7;color:#92400e}.c-app{background:#dcfce7;color:#166534}.c-blk{background:#fee2e2;color:#991b1b}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.b{border:none;border-radius:9px;padding:7px 14px;font-size:12px;font-weight:800;transition:.15s}
.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
.b-ok{background:#16a34a;color:#fff}.b-no{background:#E8112D;color:#fff}
.b-gr{background:var(--soft);color:var(--txt);border:1px solid var(--line)}
.mut{color:var(--mut)}.tiny{font-size:11px;color:var(--mut)}
.empty{text-align:center;padding:40px;color:var(--mut);background:var(--card);border-radius:16px;border:1px dashed var(--line)}
#toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column-reverse;gap:10px;align-items:center;pointer-events:none;width:min(94vw,440px)}
.tst{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 12px 34px rgba(2,8,20,.28);border:1px solid var(--line);width:100%;position:relative;overflow:hidden;animation:tstIn .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
.tst.out{animation:tstOut .3s forwards}
@keyframes tstIn{from{opacity:0;transform:translateY(-18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes tstOut{to{opacity:0;transform:translateY(-14px) scale(.94)}}
.tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;color:#fff}
.tst.ok .tic{background:linear-gradient(135deg,#22c55e,#16a34a)}
.tst.err .tic{background:linear-gradient(135deg,#E8112D,#a30c1f)}
.tst.info .tic{background:linear-gradient(135deg,#2E4A9E,#1B2F6E)}
.tmsg{font-size:13px;font-weight:700;line-height:1.6;flex:1;color:var(--txt);word-break:break-word}
.tx{border:none;background:var(--soft);width:24px;height:24px;border-radius:7px;font-size:11px;color:var(--mut);flex-shrink:0;transition:.15s;display:flex;align-items:center;justify-content:center}
.tx:hover{background:#fee2e2;color:#dc2626}
.tbar{position:absolute;bottom:0;right:0;height:3px;width:100%;transform-origin:right;animation:tbar 3.8s linear forwards}
.tst.ok .tbar{background:linear-gradient(90deg,#22c55e,#16a34a)}
.tst.err .tbar{background:linear-gradient(90deg,#E8112D,#a30c1f)}
.tst.info .tbar{background:linear-gradient(90deg,#2E4A9E,#1B2F6E)}
@keyframes tbar{to{transform:scaleX(0)}}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:700;color:var(--tl)}
body.dark #loading{background:rgba(10,15,35,.82);color:#8fa8e8}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--tl);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(13,22,56,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:95;padding:30px 12px;overflow:auto}
.ov.show{display:flex}
.box{background:var(--card);border-radius:20px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:pop .25s;max-width:430px}
.box-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.box-h b{font-size:15px;color:var(--head)}
.box-b{padding:20px}
.x{border:none;background:var(--soft);width:32px;height:32px;border-radius:9px;font-size:14px;transition:.15s;color:var(--txt);display:flex;align-items:center;justify-content:center}
.x:hover{background:#fee2e2;color:#dc2626;transform:rotate(90deg)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--card);color:var(--txt);transition:.2s}
.field input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px rgba(27,47,110,.1)}
.mrow{display:flex;gap:8px;margin-top:10px}
.mrow .btn-primary,.mrow .btn-ghost{flex:1 1 0;min-width:0;width:auto;margin-top:0}
/* حاوية كلمة المرور بالمودال — العين جوه الحقل */
.pwwrap{position:relative}
.pwwrap input{padding-left:44px;width:100%}
.pweye{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--mut);padding:4px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.15s}
.pweye:hover{color:var(--tl);background:var(--soft)}
#foot{position:fixed;bottom:0;right:0;left:0;background:linear-gradient(180deg,rgba(16,27,62,.97),rgba(27,47,110,.98));color:#9fb0d8;display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 18px;z-index:30;border-top:1px solid rgba(255,255,255,.06);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);flex-wrap:wrap}
.ftr-txt{display:flex;flex-direction:column;align-items:center;line-height:1.5}
.ftr-txt b{color:#e6eaf6;font-size:12px;font-weight:800}.ftr-txt span{font-size:10.5px}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;transition:.25s}
.qr-wrap img{width:56px;height:56px;border-radius:10px;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(232,17,45,.35);transition:.25s}
.qr-wrap:hover{transform:translateY(-3px)}
.qr-wrap:hover img{box-shadow:0 0 0 2px #E8112D,0 0 22px rgba(232,17,45,.55)}
.qr-wrap span{font-size:8.5px;color:#ff8fa0;font-weight:800;letter-spacing:.4px;white-space:nowrap}
@media(max-width:920px){
 .tb-brand span{display:none}
 .btn-out .lg{display:none}.btn-out .sm{display:inline}.btn-out{padding:8px 12px}
 .ftr-txt b{font-size:10px}.qr-wrap img{width:46px;height:46px}
 .grid-4{grid-template-columns:1fr 1fr}.tb-left{gap:6px}.subbar{padding:8px 14px}
 .login-card input,.field input{font-size:16px}
}
@media(min-width:921px){.btn-out .sm{display:none}}
@media(max-width:480px){
 .otpbox input{width:38px;height:46px;font-size:18px}
 .login-card{padding:22px 16px 14px}
 .login-card h1{font-size:19px}
 .grid-4{grid-template-columns:1fr 1fr}
 .subbar h2{font-size:15px}
 #tabs .nitem{padding:8px 9px;font-size:11.5px}
 .card{padding:13px}
 .dev .ic{width:40px;height:40px;font-size:18px}
 #foot{gap:10px;padding:6px 8px}
 .tmsg{font-size:12px}
}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div id="ldTxt">جارٍ التحميل…</div></div>
<div id="toasts"></div>

<div id="login">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="login-card">
    <img class="co-logo" src="enovate.png" alt="logo" onerror="this.style.display='none'">
    <h1>E-Collect Admin</h1>
    <div class="sub" data-i18n="sub"></div>
    <div id="aEmail">
      <label data-i18n="emailLb"></label>
      <input id="em" type="email" placeholder="admin@company.com" onkeydown="if(event.key==='Enter')go()">
      <button class="btn-primary" id="b1" onclick="go()" data-i18n="enter"></button>
    </div>
    <div id="aOtp" style="display:none">
      <label><span data-i18n="otpLb"></span> <b id="otpM" style="direction:ltr"></b></label>
      <div class="otpbox" id="otpBox"></div>
      <button class="btn-primary" onclick="goVerify()" data-i18n="verify"></button>
      <button class="btn-ghost" onclick="resendOtp()" data-i18n="resend"></button>
      <button class="btn-ghost" onclick="location.reload()" data-i18n="changeEmail"></button>
    </div>
    <div class="err" id="er"></div>
    <div class="login-foot">
      <a class="lf-qr" href="https://axentro.site/links.html" target="_blank" rel="noopener">
        <img src="qr.png" alt="QR" onerror="this.style.display='none'"><span>Scan Me ▸ Click On Me</span>
      </a>
      <div class="lf-txt"><b>Powered by Axentro</b><span>© 2024 All Rights Reserved</span></div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <header id="topbar">
    <div class="tb-brand">
      <div class="lgbox"><img src="enovate.png" alt="logo" onerror="this.style.display='none'"></div>
      <div><b>E-Collect Admin</b><span id="who"></span></div>
    </div>
    <nav id="tabs">
      <button class="nitem active" data-t="pend" onclick="tab('pend')"><span id="tl_pend">⏳ طلبات معلقة</span> <span id="cnt"></span></button>
      <button class="nitem" data-t="devs" onclick="tab('devs')"><span id="tl_devs">💻 كل الأجهزة</span></button>
      <button class="nitem" data-t="usrs" onclick="tab('usrs')"><span id="tl_usrs">👤 المستخدمون</span></button>
    </nav>
    <div class="tb-left">
      <button id="sndBtn" class="tb-ic" onclick="toggleSound()" title="Sound">🔊</button>
      <button id="thmBtn" class="tb-ic" onclick="toggleTheme()" title="Theme">🌙</button>
      <button id="langBtn" class="tb-lang" onclick="toggleLang()" title="Language">EN</button>
      <button class="btn-out" onclick="askLogout()"><span class="lg" data-i18n="lBtn">تسجيل الخروج</span><span class="sm" data-i18n="lBtnSm">خروج</span></button>
    </div>
  </header>
  <div class="subbar">
    <h2 id="vtitle">—</h2>
    <div class="sb-actions">
      <button class="tb-act" onclick="verifyLocation()" title="Location check">📍</button>
      <button class="tb-act" onclick="refreshNow()" title="Refresh">🔄</button>
    </div>
  </div>
  <div class="wrap">
    <div id="list"></div>
  </div>
</div>

<div class="ov" id="m_ask"><div class="box">
  <div class="box-h"><b id="ak_title"></b><button class="x" onclick="closeOv('m_ask')">✕</button></div>
  <div class="box-b">
    <div id="ak_msg" style="font-size:13.5px;line-height:1.8;color:var(--txt)"></div>
    <div class="field" id="ak_in_row" style="display:none;margin-top:12px"><label id="ak_in_lb"></label><input id="ak_in"></div>
    <div class="msg" id="ak_err"></div>

async function call(action,payload){
  const r=await fetch(SVC_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,svcKey:(typeof SVC_KEY!=='undefined'?SVC_KEY:'')},payload||{}))});
  const txt=await r.text();let d;
  try{d=JSON.parse(txt);}catch(e){throw new Error(t('svcErr',{s:r.status}));}
  if(!d.ok)throw new Error(d.error||'خطأ في الخدمة');

async function hashPass_(u,p){const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(u)+'::'+String(p)+'::ECollect'));return Array.from(new Uint8Array(raw)).map(b=>b.toString(16).padStart(2,'0')).join('');}

async function ensureAdminUser_(email){
  const ref=db.collection('users').doc(email);const doc=await ref.get();
  if(!doc.exists){await ref.set({email:email,username:email.split('@')[0],name:email.split('@')[0],role:'admin',status:'active',passEnc:'',avatarId:'',createdAt:new Date(),createdVia:'admin-panel'});return {email:email,name:email.split('@')[0],role:'admin'};}
  const d=doc.data();
  if(d.role!=='admin'){await ref.update({role:'admin'});d.role='admin';}
  if(d.status==='blocked'){await ref.update({status:'active'});d.status='active';}
  return {email:email,name:d.name||email.split('@')[0],role:'admin'};
}

function buildOtp(){
  const box=$('otpBox');box.innerHTML='';
  for(let i=0;i<6;i++){const inp=document.createElement('input');inp.maxLength=1;inp.inputMode='numeric';inp.autocomplete='one-time-code';
    inp.oninput=function(){this.value=this.value.replace(/\D/g,'');if(this.value&&this.nextElementSibling)this.nextElementSibling.focus();};
    inp.onkeydown=function(e){if(e.key==='Backspace'&&!this.value&&this.previousElementSibling){this.previousElementSibling.focus();this.previousElementSibling.value='';e.preventDefault();}if(e.key==='Enter')goVerify();};
    inp.onpaste=function(e){e.preventDefault();const txt=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(!txt)return;const bx=[...$('otpBox').children];bx.forEach((b,idx)=>b.value=txt[idx]||'');(bx[Math.min(txt.length,5)]).focus();};
    box.appendChild(inp);}
  setTimeout(()=>box.firstChild.focus(),100);
}

      const pre=await db.collection('users').doc(em).get();
      if(!pre.exists||pre.data().role!=='admin'){showLoading(false);$('er').className='err';$('er').textContent=t('mNotAdmin');playSound('err');return;}
    }else{
      await ensureAdminUser_(em);
    }
    const dev=await db.collection('devices').doc(DID).get();

/* ===== بيانات الجهاز — كاملة + إحداثيات IP + مزود احتياطي ===== */
async function deviceInfo(){
  const ua=navigator.userAgent;
  let dtype='💻 '+(LANG==='ar'?'كمبيوتر':'PC');
  if(/Android/i.test(ua))dtype='📱 Android';else if(/iPhone|iPad|iPod/i.test(ua))dtype='📱 iPhone/iPad';else if(/Mac/i.test(ua))dtype='💻 Mac';else if(/Linux/i.test(ua))dtype='💻 Linux';
  let br='Browser';if(/Edg\//.test(ua))br='Microsoft Edge';else if(/OPR\//.test(ua))br='Opera';else if(/Chrome\//.test(ua))br='Google Chrome';else if(/Firefox\//.test(ua))br='Firefox';else if(/Safari\//.test(ua))br='Safari';
  let os='OS';if(/Windows NT 10/.test(ua))os='Windows 10/11';else if(/Windows/.test(ua))os='Windows';else if(/Android/.test(ua)){const m=ua.match(/Android (\d+)/);os='Android '+(m?m[1]:'');}else if(/iPhone OS (\d+_\d+)/.test(ua))os='iOS '+ua.match(/iPhone OS (\d+_\d+)/)[1].replace('_','.');else if(/Mac OS X/.test(ua))os='macOS';else if(/Linux/.test(ua))os='Linux';
  let model='—';
  if(/Android/.test(ua)){const m=ua.match(/Android [\d.]+;\s*([^;)]+)/);if(m)model=m[1].replace(/\s*Build\/.*$/,'').trim();}
  else if(/iPhone/.test(ua))model='iPhone';else if(/iPad/.test(ua))model='iPad';
  let gpu='—';
  try{const c=document.createElement('canvas');const gl=c.getContext('webgl')||c.getContext('experimental-webgl');
    if(gl){const ext=gl.getExtension('WEBGL_debug_renderer_info');if(ext)gpu=String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)).slice(0,60);}}catch(e){}
  const ram=navigator.deviceMemory?('≥ '+navigator.deviceMemory+' GB'):'—';
  const net=(navigator.connection&&navigator.connection.effectiveType)?navigator.connection.effectiveType.toUpperCase():'—';
  const d={deviceType:dtype,browser:br,os:os,model:model,gpu:gpu,ram:ram,net:net,
    screen:screen.width+'×'+screen.height,lang:navigator.language,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'',
    cores:(navigator.hardwareConcurrency||0)+(LANG==='ar'?' نواة':' cores')};
  /* الموقع + الإحداثيات: ipapi.co أساسي → ipwho.is احتياطي */
  try{
    const r=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(5000)});
    const j=await r.json();
    d.ip=j.ip||'—';d.loc=(j.city?j.city+', ':'')+(j.country_name||'');d.isp=j.org||'—';
    d.lat=(typeof j.latitude==='number')?j.latitude:null;d.lon=(typeof j.longitude==='number')?j.longitude:null;
  }catch(e){
    try{
      const r2=await fetch('https://ipwho.is/',{signal:AbortSignal.timeout(5000)});
      const j2=await r2.json();
      if(j2&&j2.success!==false){d.ip=j2.ip||'—';d.loc=(j2.city?j2.city+', ':'')+(j2.country||'');d.isp=(j2.connection&&j2.connection.isp)||'—';d.lat=(typeof j2.latitude==='number')?j2.latitude:null;d.lon=(typeof j2.longitude==='number')?j2.longitude:null;}
      else{d.ip='—';d.loc='—';d.isp='—';d.lat=null;d.lon=null;}
    }catch(e2){d.ip='—';d.loc='—';d.isp='—';d.lat=null;d.lon=null;}
  }
  return d;
}

/* ===== ⭐ فحص دقة الموقع: GPS مقابل IP + المسافة + تحديث بيانات جهازي ===== */
function havKm(la1,lo1,la2,lo2){
  const R=6371,rad=Math.PI/180;
  const dLat=(la2-la1)*rad,dLon=(lo2-lo1)*rad;
  const s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(s));
}
async function verifyLocation(){
  if(!busyGate())return;
  toast(t('locBusy'),'info');
  const info=await deviceInfo();
  let gps=null;
  try{
    gps=await new Promise((res,rej)=>{
      if(!navigator.geolocation)return rej(new Error('unsupported'));
      navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),{timeout:12000,maximumAge:0,enableHighAccuracy:true});
    });
  }catch(e){gps=null;}
  try{await db.collection('devices').doc(getDeviceId()).update({info:info,lastUsed:new Date()});toast(t('locUpd'),'ok');}catch(e){}
  busyRel();
  let distHtml='',verdict='';
  if(gps&&typeof info.lat==='number'&&info.lat!==null&&typeof info.lon==='number'&&info.lon!==null){
    const km=havKm(info.lat,info.lon,gps.latitude,gps.longitude);
    const distTxt=(km<1?Math.round(km*1000)+' '+t('locM'):km.toFixed(1)+' '+t('locKm'));
    distHtml='<div class="field"><label>'+t('locDist')+'</label><div class="d-cell" style="background:var(--soft)"><div class="v" style="font-size:16px"><b>'+distTxt+'</b></div></div></div>';
    verdict=km<50?('<span class="chip c-app" style="margin-top:8px;font-size:12px">'+t('locMatch')+'</span>'):('<span class="chip c-pend" style="margin-top:8px;font-size:12px">'+t('locDiff')+'</span>');
  }else{
    verdict='<div class="tiny mut" style="margin-top:8px">'+t('locGpsNo')+'</div>';
  }
  const mapsIp=(info.lat!=null)?('https://www.google.com/maps?q='+info.lat+','+info.lon):'';
  const mapsGps=gps?('https://www.google.com/maps?q='+gps.latitude+','+gps.longitude):'';
  $('ed_title').textContent=t('locT');
  $('ed_body').innerHTML=
  '<div class="field"><label>'+t('locIpH')+'</label><div class="d-cell" style="background:var(--soft)"><div class="v" style="font-size:12.5px;line-height:2.2">'+
  '🌐 IP: <b>'+esc(info.ip||'—')+'</b><br>📍 '+esc(info.loc||'—')+'<br>🏢 '+esc(info.isp||'—')+
  (mapsIp?('<br><a href="'+mapsIp+'" target="_blank" rel="noopener" style="color:var(--tl2);font-weight:800">Google Maps ↗</a>'):'')+
  '</div></div></div>'+
  '<div class="field"><label>'+t('locGpsH')+'</label><div class="d-cell" style="background:var(--soft)"><div class="v" style="font-size:12.5px;line-height:2.2">'+
  (gps?('📍 '+gps.latitude.toFixed(5)+', '+gps.longitude.toFixed(5)+'<br>🎯 '+t('locAcc')+': ±'+Math.round(gps.accuracy)+' '+t('locM')+
  (mapsGps?('<br><a href="'+mapsGps+'" target="_blank" rel="noopener" style="color:var(--tl2);font-weight:800">Google Maps ↗</a>'):''))
      :('<span class="mut">'+t('locGpsNo')+'</span>'))+
  '</div></div></div>'+distHtml+verdict+
  '<div class="tiny mut" style="margin-top:12px;line-height:1.9">'+t('locNote')+'</div>';
  openOv('m_edit');
}

/* ================================================================
   الإقلاع — جلسة محصّنة: فتح فوري + تحقق خلفي صامت
   + تحديث ذكي لبيانات جهازك (فقط لو الحقول الجديدة ناقصة — توفيرًا
   لكوتا مزود الموقع)
   ================================================================ */
(async function(){
  applyTheme();applyLang();
  $('sndBtn').textContent=soundOn?'🔊':'🔇';
  toastQueue.forEach(m=>toast(m,'err'));toastQueue=[];
  const s=lsGet('ad_sess'),e=lsGet('ad_email');
  if(!(s==='1'&&e))return;
  ME={email:e,name:e.split('@')[0]};
  openApp();
  (async()=>{
    try{
      await authReady;
      if(!firebase.auth().currentUser)return;
      if(ADMIN&&e===ADMIN)await ensureAdminUser_(e);
      try{await db.collection('users').doc(e).update({lastLogin:new Date()});}catch(_){}
      const u=await db.collection('users').doc(e).get();
      if(u.exists){
        const d=u.data();
        if(d.name&&d.name!==ME.name){ME.name=d.name;$('who').textContent=ME.name+' · '+ME.email;}
        if(d.status==='blocked'){askConfirm(t('mBlkT'),t('mBlkU'),t('okB'),true,()=>{lsDel('ad_sess');lsDel('ad_email');location.reload();});return;}
        const d2=getDeviceId();
        const dev=await db.collection('devices').doc(d2).get();
        if(dev.exists){
          if(dev.data().status==='blocked'){askConfirm(t('mDevBlkT'),t('mDevBlkM'),t('okB'),true,()=>{lsDel('ad_sess');lsDel('ad_email');location.reload();});return;}
          /* ⭐ تحديث ذكي: فقط لو بيانات الجهاز من schema قديم (ناقص gpu/model) */
          const inf=dev.data().info||{};
          if(!inf.gpu||!inf.model){
            console.log('[ECA] Device info outdated — refreshing');
            try{const fresh=await deviceInfo();await db.collection('devices').doc(d2).update({info:fresh});}catch(_){}
          }
        }
      }
      db.collection('devices').doc(getDeviceId()).update({lastUsed:new Date()}).catch(()=>{});
    }catch(err){
      console.warn('[ECA] Background verify skipped (session kept):',err&&err.message);
    }
  })();
})();
</script>
