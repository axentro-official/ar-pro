<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Collect Admin — إدارة الأجهزة والمستخدمين</title>
<link rel="icon" href="enovate.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
:root{--tl:#1B2F6E;--tl2:#2E4A9E;--acc:#E8112D;--bg:#f0f2f8;--card:#fff;--soft:#f6f8fd;--line:#e3e7f2;--line2:#eef1f8;--mut:#64748b;--txt:#0f172a;--head:#101B3E;--subbg:rgba(255,255,255,.88)}
body.dark{--bg:#0c1226;--card:#161e3c;--soft:#1e2850;--line:#2b3765;--line2:#232d55;--mut:#9aa8cc;--txt:#e7ecf9;--head:#e7ecf9;--subbg:rgba(16,24,52,.92)}
body{background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:96px;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0d1638,#1B2F6E 55%,#31437f);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;animation:float 9s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#E8112D;top:-90px;right:-70px;opacity:.25}
.orb.b{width:280px;height:280px;background:#2E4A9E;bottom:-70px;left:-60px;animation-delay:-4s}
.orb.c{width:200px;height:200px;background:#E8112D;bottom:15%;right:12%;animation-delay:-7s;opacity:.2}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.07)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.login-card{background:var(--card);border-radius:22px;padding:30px 32px 18px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.35);text-align:center;animation:pop .5s;position:relative;z-index:2}
.co-logo{height:60px;margin:0 auto 6px;display:block;max-width:200px;object-fit:contain}
.login-card h1{font-size:22px;font-weight:900;margin-top:4px;color:var(--head)}
.login-card .sub{color:var(--mut);font-size:13px;margin:4px 0 16px}
.login-card label{display:block;text-align:right;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 4px}
.login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--card);color:var(--txt);transition:.2s}
.login-card input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(27,47,110,.12)}
.otpbox{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0}
.otpbox input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:900;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);transition:.15s}
.otpbox input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(27,47,110,.15)}
.err{color:#dc2626;font-size:12.5px;font-weight:700;margin-top:10px;min-height:18px}
body.dark .err{color:#f87171}
.okmsg{color:#16a34a;font-size:12.5px;font-weight:700;margin-top:10px;min-height:18px}
body.dark .okmsg{color:#4ade80}
.msg{color:#dc2626;font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px}
body.dark .msg{color:#f87171}
.btn-primary{background:linear-gradient(135deg,#2E4A9E,#1B2F6E);color:#fff;border:none;border-radius:11px;padding:11px;font-weight:800;font-size:13.5px;width:100%;margin-top:12px;position:relative;overflow:hidden;transition:.15s;box-shadow:0 4px 12px rgba(27,47,110,.35)}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:9px;font-weight:700;font-size:12.5px;color:var(--txt);width:100%;margin-top:8px;transition:.15s}
.btn-ghost:hover{border-color:var(--tl);color:var(--tl)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:12px;height:12px;transform:translate(-50%,-50%);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{width:140px;height:140px;opacity:0}}
.login-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px}
.lf-qr{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none}
.lf-qr img{width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:2px;transition:.2s}
.lf-qr:hover img{box-shadow:0 0 0 2px var(--acc),0 0 14px rgba(232,17,45,.4)}
.lf-qr span{font-size:7.5px;color:var(--acc);font-weight:800;white-space:nowrap}
.lf-txt{text-align:right;line-height:1.6}
.lf-txt b{font-size:11px;color:var(--txt)}.lf-txt span{display:block;font-size:10px;color:var(--mut);font-weight:700}
/* ===== الشريط العلوي — مطابق للموقع حرفيًا ===== */
#topbar{position:fixed;top:0;right:0;left:0;height:60px;background:linear-gradient(90deg,#101B3E,#1B2F6E);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;box-shadow:0 2px 14px rgba(16,27,62,.35);backdrop-filter:blur(10px)}
.tb-brand{display:flex;gap:10px;align-items:center;flex-shrink:0}
.lgbox{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}
.lgbox img{height:28px;max-width:86px;object-fit:contain;display:block}
.tb-brand b{color:#fff;font-size:14.5px;display:block;line-height:1.25}
.tb-brand span{font-size:10px;color:#9fb0d8;display:block}
#tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.nitem{display:inline-flex;gap:7px;align-items:center;padding:8px 13px;border:none;background:none;color:#b6c3e2;border-radius:10px;font-size:12.8px;font-weight:700;white-space:nowrap;transition:.15s}
.nitem:hover{background:rgba(255,255,255,.08);color:#fff}
.nitem.active{background:linear-gradient(135deg,#E8112D,#b30d23);color:#fff;box-shadow:0 3px 10px rgba(232,17,45,.4)}
.tb-left{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-right:auto}
.tb-ic{background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:15px;color:#d7def2;transition:.15s;display:flex;align-items:center;justify-content:center}
.tb-ic:hover{background:rgba(255,255,255,.18)}
.tb-lang{background:rgba(255,255,255,.08);border:none;border-radius:10px;width:36px;height:36px;font-size:12px;font-weight:900;color:#d7def2;transition:.15s}
.tb-lang:hover{background:rgba(255,255,255,.18)}
/* زر الخروج — نص واضح بنفس التدرج الأحمر بتاع الموقع */
.btn-out{background:linear-gradient(135deg,#E8112D,#a30c1f);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap;box-shadow:0 3px 10px rgba(232,17,45,.35)}
.btn-out:hover{filter:brightness(1.15);transform:translateY(-1px)}
/* شريط ثانوي مطابق للموقع */
.subbar{background:var(--subbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:60px;z-index:30}
.subbar h2{font-size:17px;font-weight:800;color:var(--head)}
.sb-actions{margin-right:auto;display:flex;gap:8px;align-items:center}
.tb-act{background:var(--card);border:1.5px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:14px;color:var(--txt);transition:.15s;flex-shrink:0}
.tb-act:hover{border-color:var(--tl);color:var(--tl)}
.wrap{max-width:1150px;margin:0 auto;padding:16px 20px 20px}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--line);margin-bottom:12px;box-shadow:0 1px 3px rgba(16,27,62,.06);transition:box-shadow .2s,transform .2s;animation:pop .25s}
.card:hover{box-shadow:0 8px 22px rgba(16,27,62,.12);transform:translateY(-2px)}
.dev{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dev .ic{width:48px;height:48px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.dev .inf{flex:1;min-width:220px}
.nm{font-size:14.5px;font-weight:900;color:var(--head)}
.em{font-size:12px;color:var(--tl2);font-weight:700;direction:ltr;text-align:right}
.meta{font-size:11px;color:var(--mut);margin-top:4px}
.strow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px;padding:10px;background:var(--soft);border-radius:12px;border:1px solid var(--line)}
.g4 .l{font-size:9.5px;color:var(--mut);font-weight:800;display:flex;align-items:center;gap:4px}
.g4 .v{font-size:11.5px;font-weight:800;color:var(--head);margin-top:2px;direction:ltr;text-align:right;word-break:break-all;white-space:normal;line-height:1.4}
.chip{padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;display:inline-block}
.c-pend{background:#fef3c7;color:#92400e}.c-app{background:#dcfce7;color:#166534}.c-blk{background:#fee2e2;color:#991b1b}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.b{border:none;border-radius:9px;padding:7px 14px;font-size:12px;font-weight:800;transition:.15s}
.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
.b-ok{background:#16a34a;color:#fff}.b-no{background:#E8112D;color:#fff}
.b-gr{background:var(--soft);color:var(--txt);border:1px solid var(--line)}
.mut{color:var(--mut)}.tiny{font-size:11px;color:var(--mut)}
.empty{text-align:center;padding:40px;color:var(--mut);background:var(--card);border-radius:16px;border:1px dashed var(--line)}
#toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(94vw,460px);max-height:none;overflow:visible}
.tst{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:0 12px 34px rgba(2,8,20,.25);border:1px solid var(--line);width:100%;position:relative;overflow:hidden;animation:tstIn .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
.tst.out{animation:tstOut .3s forwards}
@keyframes tstIn{from{opacity:0;transform:translateY(-18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes tstOut{to{opacity:0;transform:translateY(-14px) scale(.94)}}
.tic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0;color:#fff}
.tst.ok .tic{background:linear-gradient(135deg,#22c55e,#16a34a)}
.tst.err .tic{background:linear-gradient(135deg,#E8112D,#a30c1f)}
.tst.info .tic{background:linear-gradient(135deg,#2E4A9E,#1B2F6E)}
.tmsg{font-size:13px;font-weight:700;line-height:1.6;flex:1;color:var(--txt);word-break:break-word}
.tbar{position:absolute;bottom:0;right:0;height:3px;width:100%;transform-origin:right;animation:tbar 4s linear forwards}
.tst.ok .tbar{background:linear-gradient(90deg,#22c55e,#16a34a)}
.tst.err .tbar{background:linear-gradient(90deg,#E8112D,#a30c1f)}
.tst.info .tbar{background:linear-gradient(90deg,#2E4A9E,#1B2F6E)}
@keyframes tbar{to{transform:scaleX(0)}}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.8);backdrop-filter:blur(3px);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:700;color:var(--tl)}
body.dark #loading{background:rgba(10,15,35,.82);color:#8fa8e8}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--tl);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(13,22,56,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:95;padding:30px 12px;overflow:auto}
.ov.show{display:flex}
.box{background:var(--card);border-radius:20px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:pop .25s;max-width:430px}
.box-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.box-h b{font-size:15px;color:var(--head)}
.box-b{padding:20px}
.x{border:none;background:var(--soft);width:32px;height:32px;border-radius:9px;font-size:14px;transition:.15s;color:var(--txt)}
.x:hover{background:#fee2e2;color:#dc2626;transform:rotate(90deg)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--card);color:var(--txt);transition:.2s}
.field input:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px rgba(27,47,110,.1)}
#foot{position:fixed;bottom:0;right:0;left:0;background:linear-gradient(180deg,rgba(16,27,62,.97),rgba(27,47,110,.98));color:#9fb0d8;display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 18px;z-index:30;border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(8px)}
.ftr-txt{display:flex;flex-direction:column;align-items:center;line-height:1.5}
.ftr-txt b{color:#e6eaf6;font-size:12px;font-weight:800}.ftr-txt span{font-size:10.5px}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;transition:.25s}
.qr-wrap img{width:56px;height:56px;border-radius:10px;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(232,17,45,.35);transition:.25s}
.qr-wrap:hover{transform:translateY(-3px)}
.qr-wrap:hover img{box-shadow:0 0 0 2px #E8112D,0 0 22px rgba(232,17,45,.55)}
.qr-wrap span{font-size:8.5px;color:#ff8fa0;font-weight:800;letter-spacing:.4px;white-space:nowrap}
@media(max-width:920px){.tb-brand span{display:none}.ftr-txt b{font-size:10px}.qr-wrap img{width:46px;height:46px}.grid-4{grid-template-columns:1fr 1fr}.tb-left{gap:6px}.btn-out{padding:8px 10px;font-size:11.5px}.subbar{padding:8px 14px}}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div id="ldTxt">جارٍ التحميل…</div></div>
<div id="toasts"></div>

<div id="login">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="login-card">
    <img class="co-logo" src="enovate.png" alt="logo" onerror="this.style.display='none'">
    <h1>E-Collect Admin</h1>
    <div class="sub" data-i18n="sub"></div>
    <div id="aEmail">
      <label data-i18n="emailLb"></label>
      <input id="em" type="email" placeholder="admin@company.com" onkeydown="if(event.key==='Enter')go()">
      <button class="btn-primary" id="b1" onclick="go()" data-i18n="enter"></button>
    </div>
    <div id="aOtp" style="display:none">
      <label><span data-i18n="otpLb"></span> <b id="otpM" style="direction:ltr"></b></label>
      <div class="otpbox" id="otpBox"></div>
      <button class="btn-primary" onclick="goVerify()" data-i18n="verify"></button>
      <button class="btn-ghost" onclick="resendOtp()" data-i18n="resend"></button>
      <button class="btn-ghost" onclick="location.reload()" data-i18n="changeEmail"></button>
    </div>
    <div class="err" id="er"></div>
    <div class="login-foot">
      <a class="lf-qr" href="https://axentro.site/links.html" target="_blank" rel="noopener">
        <img src="qr.png" alt="QR" onerror="this.style.display='none'"><span>Scan Me ▸ Click On Me</span>
      </a>
      <div class="lf-txt"><b>Powered by Axentro</b><span>© 2024 All Rights Reserved</span></div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <header id="topbar">
    <div class="tb-brand">
      <div class="lgbox"><img src="enovate.png" alt="logo" onerror="this.style.display='none'"></div>
      <div><b>E-Collect Admin</b><span id="who"></span></div>
    </div>
    <nav id="tabs">
      <button class="nitem active" data-t="pend" onclick="tab('pend')"><span id="tl_pend">⏳ طلبات معلقة</span> <span id="cnt"></span></button>
      <button class="nitem" data-t="devs" onclick="tab('devs')"><span id="tl_devs">💻 كل الأجهزة</span></button>
      <button class="nitem" data-t="usrs" onclick="tab('usrs')"><span id="tl_usrs">👤 المستخدمون</span></button>
    </nav>
    <div class="tb-left">
      <button id="sndBtn" class="tb-ic" onclick="toggleSound()" title="Sound">🔊</button>
      <button id="thmBtn" class="tb-ic" onclick="toggleTheme()" title="Theme">🌙</button>
      <button id="langBtn" class="tb-lang" onclick="toggleLang()" title="Language">EN</button>
      <button class="btn-out" onclick="askLogout()">🚪 <span data-i18n="lBtn">تسجيل الخروج</span></button>
    </div>
  </header>
  <div class="subbar">
    <h2 id="vtitle">—</h2>
    <div class="sb-actions"><button class="tb-act" onclick="refreshNow()" title="Refresh">🔄</button></div>
  </div>
  <div class="wrap">
    <div id="list"></div>
  </div>
</div>

<div class="ov" id="m_ask"><div class="box">
  <div class="box-h"><b id="ak_title"></b><button class="x" onclick="closeOv('m_ask')">✕</button></div>
  <div class="box-b">
    <div id="ak_msg" style="font-size:13.5px;line-height:1.8;color:var(--txt)"></div>
    <div class="field" id="ak_in_row" style="display:none;margin-top:12px"><label id="ak_in_lb"></label><input id="ak_in"></div>
    <div class="msg" id="ak_err"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn-primary" id="ak_ok" style="flex:1" onclick="askOk()"></button><button class="btn-ghost" onclick="closeOv('m_ask')" style="margin-top:0" data-i18n="noB"></button></div>
  </div>
</div></div>

<div class="ov" id="m_edit"><div class="box">
  <div class="box-h"><b id="ed_title"></b><button class="x" onclick="closeOv('m_edit')">✕</button></div>
  <div class="box-b" id="ed_body"></div>
</div></div>

<footer id="foot">
  <a class="qr-wrap" href="https://axentro.site/links.html" target="_blank" rel="noopener">
    <img src="qr.png" alt="QR Axentro" onerror="this.style.display='none'"><span>Scan Me ▸ Click On Me</span>
  </a>
  <div class="ftr-txt"><b>© 2024 Axentro – All Rights Reserved</b><span>By Axentro Team</span></div>
</footer>

<script src="firebase-config.js"></script>
<script>
/* ================================================================
   E-Collect Admin v4.2.1
   إصلاح حرج: infinite recursion بين draw() و applyLang() —
   هي اللي كانت بتفضي التابات وتكسر الرندر (Maximum call stack)
   توحيد الشكل مع الموقع: تابات nitem جوه الشريط + زر خروج بنص + subbar
   ================================================================ */
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
firebase.auth().signInAnonymously().catch(()=>{});

/* ===== أدوات أساسية — أول السكريبت ===== */
let ME=null,TAB='pend',DEVS={},USRS={},DID='',EMAIL='',audioCtx=null,BUSY=false,soundOn=true;
const ADMIN=(typeof ADMIN_EMAIL==='string')?ADMIN_EMAIL.trim().toLowerCase():'';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function showLoading(b){$('loading').style.display=b?'flex':'none';}
function openOv(id){$(id).classList.add('show');}
function closeOv(id){$(id).classList.remove('show');}
function ed_done(){closeOv('m_edit');}
function busyGate(){if(BUSY){toast(t('mBusy'),'info');return false;}BUSY=true;return true;}
function busyRel(){BUSY=false;}

function tone(f,t0,dur,type,vol){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+dur+.05);}
function playSound(k){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t0=audioCtx.currentTime;if(k==='ok'){tone(523.25,t0,.22,'sine',.16);tone(659.25,t0+.09,.22,'sine',.16);tone(783.99,t0+.18,.3,'sine',.18);}else if(k==='err'){tone(196,t0,.18,'sawtooth',.08);tone(155.56,t0+.12,.28,'sawtooth',.09);}else{tone(880,t0,.1,'sine',.07);}}catch(e){}}

/* ===== الاتصال بالخدمة ===== */
async function call(action,payload){
  const r=await fetch(SVC_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,svcKey:(typeof SVC_KEY!=='undefined'?SVC_KEY:'')},payload||{}))});
  const txt=await r.text();let d;
  try{d=JSON.parse(txt);}catch(e){throw new Error(t('svcErr',{s:r.status}));}
  if(!d.ok)throw new Error(d.error||'خطأ في الخدمة');
  return d.data;
}
async function hashPass_(u,p){const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(u)+'::'+String(p)+'::ECollect'));return Array.from(new Uint8Array(raw)).map(b=>b.toString(16).padStart(2,'0')).join('');}

async function ensureAdminUser_(email){
  const ref=db.collection('users').doc(email);const doc=await ref.get();
  if(!doc.exists){await ref.set({email:email,username:email.split('@')[0],name:email.split('@')[0],role:'admin',status:'active',passEnc:'',avatarId:'',createdAt:new Date(),createdVia:'admin-panel'});return {email:email,name:email.split('@')[0],role:'admin'};}
  const d=doc.data();
  if(d.role!=='admin'){await ref.update({role:'admin'});d.role='admin';}
  if(d.status==='blocked'){await ref.update({status:'active'});d.status='active';}
  return {email:email,name:d.name||email.split('@')[0],role:'admin'};
}

/* ===== OTP ===== */
function buildOtp(){
  const box=$('otpBox');box.innerHTML='';
  for(let i=0;i<6;i++){const inp=document.createElement('input');inp.maxLength=1;inp.inputMode='numeric';inp.autocomplete='one-time-code';
    inp.oninput=function(){this.value=this.value.replace(/\D/g,'');if(this.value&&this.nextElementSibling)this.nextElementSibling.focus();};
    inp.onkeydown=function(e){if(e.key==='Backspace'&&!this.value&&this.previousElementSibling){this.previousElementSibling.focus();this.previousElementSibling.value='';e.preventDefault();}if(e.key==='Enter')goVerify();};
    inp.onpaste=function(e){e.preventDefault();const txt=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(!txt)return;const bx=[...$('otpBox').children];bx.forEach((b,idx)=>b.value=txt[idx]||'');(bx[Math.min(txt.length,5)]).focus();};
    box.appendChild(inp);}
  setTimeout(()=>box.firstChild.focus(),100);
}
async function go(){
  const em=$('em').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('er').className='err';$('er').textContent=t('mEmail');playSound('err');return;}
  EMAIL=em;$('er').textContent='';$('er').className='err';showLoading(true);
  try{
    DID=getDeviceId();
    const isAdminMail=(ADMIN&&em===ADMIN);
    if(!isAdminMail){
      const pre=await db.collection('users').doc(em).get();
      if(!pre.exists||pre.data().role!=='admin'){showLoading(false);$('er').className='err';$('er').textContent=t('mNotAdmin');playSound('err');return;}
    }else{
      await ensureAdminUser_(em);
    }
    const dev=await db.collection('devices').doc(DID).get();
    if(dev.exists&&dev.data().status==='approved'&&dev.data().email===em){
      const u=await db.collection('users').doc(em).get();
      if(!u.exists||u.data().role!=='admin'){showLoading(false);$('er').className='err';$('er').textContent=t('mOnly');playSound('err');return;}
      await db.collection('devices').doc(DID).update({lastUsed:new Date()});
      ME={email:em,name:u.data().name||em.split('@')[0]};
      showLoading(false);openApp();return;
    }
    await call('sendOtp',{email:em});
    $('aEmail').style.display='none';$('aOtp').style.display='block';$('otpM').textContent=em;
    buildOtp();showLoading(false);
    $('er').className='okmsg';$('er').textContent=t('mOtp');playSound('info');
  }catch(e){showLoading(false);$('er').className='err';$('er').textContent=e.message;playSound('err');}
}
function resendOtp(){go();}
async function goVerify(){
  const code=[...$('otpBox').children].map(i=>i.value).join('');
  if(code.length!==6){$('er').className='err';$('er').textContent=t('mCode');playSound('err');return;}
  showLoading(true);
  try{
    await call('verifyOtp',{email:EMAIL,code:code});
    const isAdminMail=(ADMIN&&EMAIL===ADMIN);
    if(!isAdminMail){
      const u=await db.collection('users').doc(EMAIL).get();
      if(!u.exists||u.data().role!=='admin'){showLoading(false);$('er').className='err';$('er').textContent=t('mOnly');playSound('err');return;}
    }
    if(isAdminMail){
      const au=await ensureAdminUser_(EMAIL);
      const prev=await db.collection('devices').doc(DID).get();
      const oldEmail=prev.exists?(prev.data().email||''):'';
      const info=await deviceInfo();
      await db.collection('devices').doc(DID).set({did:DID,fp:DID,email:EMAIL,name:navigator.userAgent.slice(0,90),info:info,status:'approved',requestedAt:(prev.exists&&prev.data().requestedAt)?prev.data().requestedAt:new Date(),approvedAt:new Date(),approvedBy:'auto (مالك النظام)',lastUsed:new Date()},{merge:false});
      if(oldEmail&&oldEmail!==EMAIL)log_('استحواذ مالك النظام على جهاز','الجهاز '+DID+' كان مسجلًا لـ '+oldEmail+' — تم الاستحواذ تلقائيًا أثناء دخول اللوحة');
      ME={email:EMAIL,name:au.name};lsSet('ad_sess','1');lsSet('ad_email',EMAIL);
      showLoading(false);openApp();toast(t('mTake'),'ok');return;
    }
    const dev=await db.collection('devices').doc(DID).get();
    const u=await db.collection('users').doc(EMAIL).get();
    if(dev.exists&&dev.data().email===EMAIL&&dev.data().status==='approved'){
      ME={email:EMAIL,name:u.data().name||'Admin'};lsSet('ad_sess','1');lsSet('ad_email',EMAIL);showLoading(false);openApp();return;
    }
    const info=await deviceInfo();
    await db.collection('devices').doc(DID).set({did:DID,fp:DID,email:EMAIL,name:navigator.userAgent.slice(0,90),info:info,status:'pending',requestedAt:new Date(),lastUsed:new Date()},{merge:true});
    showLoading(false);$('er').className='err';$('er').textContent=t('mPending');playSound('err');
  }catch(e){showLoading(false);$('er').className='err';$('er').textContent=e.message;playSound('err');}
}

/* ⭐ draw() يرسم مباشرة باللغة الحالية — لا يعيد استدعاء applyLang (إصلاح الـ recursion) */
function draw(){
  const vt={pend:'vPend',devs:'vDevs',usrs:'vUsrs'}[TAB];
  $('vtitle').textContent=t(vt);
  if(TAB==='pend'){
    const pend=Object.values(DEVS).filter(d=>d.status==='pending');
    $('cnt').textContent=pend.length?'('+pend.length+')':'';
    $('list').innerHTML=(pend.length?pend.map(d=>card(d)).join(''):'<div class="empty">'+t('noPend')+'</div>');
  }else if(TAB==='devs'){
    const all=Object.values(DEVS).sort((a,b)=>((b.lastUsed&&b.lastUsed.seconds)||0)-((a.lastUsed&&a.lastUsed.seconds)||0));
    $('cnt').textContent='';
    $('list').innerHTML=(all.length?all.map(d=>card(d)).join(''):'<div class="empty">'+t('noDevs')+'</div>');
  }else{
    const all=Object.values(USRS);
    $('list').innerHTML=(all.length?all.map(u=>userCard(u)).join(''):'<div class="empty">'+t('noUsrs')+'</div>');
  }
}
function card(d){
  const usr=USRS[d.email];
  const nm=(usr&&usr.username)?(usr.username+' — '+d.email):d.email;
  const st=d.status==='approved'?'<span class="chip c-app">'+t('chApp')+'</span>':(d.status==='pending'?'<span class="chip c-pend">'+t('chPen')+'</span>':'<span class="chip c-blk">'+t('chBlk')+'</span>');
  const i=d.info||{};
  return '<div class="card"><div class="dev"><div class="ic">'+(d.status==='approved'?'💻':(d.status==='pending'?'⏳':'⛔'))+'</div>'+
  '<div class="inf"><div class="nm">'+esc(nm||'—')+'</div>'+
  '<div class="strow">'+st+(i.deviceType?'<span class="chip c-pend">'+esc(i.deviceType)+'</span>':'')+(i.os?'<span class="chip c-pend">'+esc(i.os)+'</span>':'')+(i.browser?'<span class="chip c-pend">'+esc(i.browser)+'</span>':'')+'</div>'+
  '<div class="meta">🕐 '+t('req')+': '+fmtD(d.requestedAt)+' · '+t('lastU')+': '+fmtD(d.lastUsed)+(d.approvedBy?(' · '+t('appBy')+': '+esc(d.approvedBy)):'')+'</div>'+
  '<div class="grid-4">'+g4('🌐 IP',i.ip||'—')+g4(t('locL'),i.loc||'—')+g4(t('ispL'),i.isp||'—')+g4(t('scrL'),i.screen||'—')+g4(t('lngL'),(i.lang||'—')+' / '+(i.tz||'—'))+g4(t('corL'),i.cores||'—')+'</div></div>'+
  '<div class="acts">'+(d.status!=='approved'?'<button class="b b-ok" onclick="devAct(\''+d.did+'\',\'approved\')">'+t('bApp')+'</button>':'')+
  (d.status!=='blocked'?'<button class="b b-no" onclick="devAct(\''+d.did+'\',\'blocked\')">'+t('bBlk')+'</button>':'<button class="b b-ok" onclick="devAct(\''+d.did+'\',\'approved\')">'+t('bUnb')+'</button>')+
  '<button class="b b-gr" onclick="devDel(\''+d.did+'\')">'+t('bDelD')+'</button></div></div></div>';
}
function userCard(u){
  const isAdm=u.role==='admin';
  const key=safeId(u.email);
  const pw=u.passEnc?decodeURIComponent(escape(atob(u.passEnc))):'';
  PW_STORE[key]=pw;
  return '<div class="card"><div class="dev"><div class="ic">'+(isAdm?'⭐':'👤')+'</div>'+
  '<div class="inf"><div class="nm">'+esc(u.username||u.name||'')+'</div><div class="em">'+esc(u.email)+'</div>'+
  '<div class="strow"><span class="chip '+(isAdm?'c-app':(u.status==='blocked'?'c-blk':'c-pend'))+'">'+(isAdm?t('uAdm'):(u.status==='blocked'?t('uBlkC'):t('uEmp')))+'</span></div>'+
  '<div class="meta">📅 '+t('joined')+': '+fmtD(u.createdAt)+' · '+t('lastL')+': '+fmtD(u.lastLogin||u.createdAt)+'</div>'+
  '<div class="grid-4">'+
  g4('👤 '+(LANG==='ar'?'اسم المستخدم':'Username'),u.username||'—')+
  '<div class="g4"><div class="l">'+t('pwL')+'</div><div class="v" style="display:flex;align-items:center;gap:6px"><span id="pw_'+key+'">'+(pw?'•'.repeat(Math.min(pw.length,12)):'—')+'</span><button class="b b-gr" style="padding:3px 8px" onclick="togglePw(\''+key+'\',this)">👁</button></div></div>'+
  '</div></div>'+
  '<div class="acts">'+(u.email===ADMIN?'<span class="tiny mut">'+t('ownerN')+'</span>':
  '<button class="b b-gr" onclick="editUser(\''+key+'\')">'+t('bEdit')+'</button>'+
  '<button class="b b-gr" onclick="resetPw(\''+key+'\')">'+t('bRst')+'</button>'+
  (u.status==='blocked'?'<button class="b b-ok" onclick="unblockUser(\''+key+'\')">'+t('bUnbU')+'</button>':'<button class="b b-no" onclick="blockUser(\''+key+'\')">'+t('bBlkU')+'</button>')+
  '<button class="b b-no" onclick="delUser(\''+key+'\')">'+t('bDelU')+'</button>')+'</div></div></div>';
}
function g4(l,v){return '<div class="g4"><div class="l">'+l+'</div><div class="v">'+esc(v)+'</div></div>';}
function fmtD(ts){if(!ts)return'—';try{const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString(LANG==='ar'?'ar-EG':'en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return'—';}}

/* ===== مودال تأكيد بكلمة تأكيد للحذف الخطير ===== */
let askCb=null,askReq='';
function askConfirm(title,msg,btn,danger,cb,reqText){
  $('ak_title').textContent=title;$('ak_msg').innerHTML=msg;
  $('ak_ok').textContent=btn;$('ak_ok').className='btn-primary';
  if(danger){$('ak_ok').style.background='linear-gradient(135deg,#E8112D,#a30c1f)';$('ak_ok').style.boxShadow='0 4px 12px rgba(232,17,45,.35)';}else{$('ak_ok').style.background='';$('ak_ok').style.boxShadow='';}
  askReq=reqText||'';
  $('ak_in_row').style.display=reqText?'block':'none';
  $('ak_in_lb').textContent=reqText?(t('typeW')+' '+reqText):'';
  $('ak_in').value='';$('ak_err').textContent='';
  askCb=cb;openOv('m_ask');
}
function askOk(){
  if(askReq&&$('ak_in').value.trim()!==askReq){$('ak_err').textContent=t('typeW')+' '+askReq;playSound('err');return;}
  closeOv('m_ask');if(askCb)askCb();
}

/* ===== تعديل مستخدم (مع إعادة حساب الهاش لو اليوزرنيم اتغير) ===== */
let editTarget='';
function editUser(key){
  const u=Object.values(USRS).find(x=>safeId(x.email)===key);if(!u)return;
  if(u.email===ADMIN){toast(t('mNoDelOwner'),'err');return;}
  editTarget=u.email;
  $('ed_title').textContent=t('edT')+' — '+esc(u.username||'');
  $('ed_body').innerHTML=
  '<div class="field"><label>'+t('uLb')+'</label><input id="eu_user" value="'+esc(u.username||'')+'"></div>'+
  '<div class="field"><label>'+t('nLb')+'</label><input id="eu_name" value="'+esc(u.name||'')+'"></div>'+
  '<div class="msg" id="eu_err"></div>'+
  '<button class="btn-primary" onclick="saveUser()">'+t('saveE')+'</button>';
  openOv('m_edit');
}
async function saveUser(){
  if(!busyGate())return;
  try{
    const u=Object.values(USRS).find(x=>x.email===editTarget);
    const uu=$('eu_user').value.trim(),nn=$('eu_name').value.trim();
    if(!uu){$('eu_err').textContent=t('mUReq');busyRel();return;}
    const dup=await db.collection('users').where('username','==',uu).get();
    let taken=false;dup.forEach(d=>{if(d.id!==editTarget)taken=true;});
    if(taken){$('eu_err').textContent=t('mUTaken');playSound('err');busyRel();return;}
    const upd={username:uu,name:nn||uu};
    let needPwWarn=false;
    if(u&&u.username&&u.username!==uu){
      const pw=u.passEnc?decodeURIComponent(escape(atob(u.passEnc))):'';
      if(pw)upd.passHash=await hashPass_(uu,pw);
      else needPwWarn=true;
    }
    await db.collection('users').doc(editTarget).update(upd);
    log_('تعديل مستخدم',editTarget+' → '+uu);
    ed_done();
    toast(needPwWarn?t('mNoPwQuick'):t('mSaved'),needPwWarn?'info':'ok');
  }catch(e){$('eu_err').textContent=e.message;}
  busyRel();
}
/* ===== إعادة تعيين كلمة المرور ===== */
let pwTarget='';
const SVG_EYE='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_EYEOFF='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function eye(id,btn){const el=$(id);const show=el.type==='password';el.type=show?'text':'password';btn.innerHTML=show?SVG_EYE:SVG_EYEOFF;}
function resetPw(key){
  const u=Object.values(USRS).find(x=>safeId(x.email)===key);if(!u)return;
  if(u.email===ADMIN){toast(t('mNoDelOwner'),'err');return;}
  pwTarget=u.email;
  $('ed_title').textContent=t('edT')+' 🔑 — '+esc(u.username||'');
  $('ed_body').innerHTML=
  '<div class="field"><label>'+t('npL')+'</label><div style="position:relative"><input id="ep_pass" type="password" placeholder="••••••" style="padding-left:42px;width:100%"><button type="button" class="x" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);width:30px;height:30px" onclick="eye(\'ep_pass\',this)">'+SVG_EYEOFF+'</button></div></div>'+
  '<div class="field"><label>'+t('cpL')+'</label><input id="ep_pass2" type="password"></div>'+
  '<div class="msg" id="ep_err"></div>'+
  '<button class="btn-primary" onclick="saveNewPw()">'+t('saveP')+'</button>';
  openOv('m_edit');
}
async function saveNewPw(){
  if(!busyGate())return;
  try{
    const u=Object.values(USRS).find(x=>x.email===pwTarget);
    const p=$('ep_pass').value;
    if(p.length<4){$('ep_err').textContent=t('mMin4');playSound('err');busyRel();return;}
    if(p!==$('ep_pass2').value){$('ep_err').textContent=t('mMM');playSound('err');busyRel();return;}
    const ph=await hashPass_(u.username||u.email.split('@')[0],p);
    await db.collection('users').doc(pwTarget).update({passHash:ph,passEnc:btoa(unescape(encodeURIComponent(p)))});
    const key=safeId(pwTarget);PW_STORE[key]=p;
    log_('إعادة تعيين كلمة مرور',pwTarget);
    ed_done();toast(t('mPwUp'),'ok');
  }catch(e){$('ep_err').textContent=e.message;}
  busyRel();
}
async function delUser(key){
  const u=Object.values(USRS).find(x=>safeId(x.email)===key);if(!u)return;
  if(u.email===ADMIN){toast(t('mNoDelOwner'),'err');return;}
  askConfirm(t('dUsrT'),t('dUsrM',{em:esc(u.email)}),t('okB'),true,async()=>{
    if(!busyGate())return;
    try{await db.collection('users').doc(u.email).delete();log_('حذف مستخدم',u.email);toast(t('mUDel'),'ok');}catch(e){toast(e.message,'err');}
    busyRel();
  },t('wDel'));
}
async function blockUser(key){
  const u=Object.values(USRS).find(x=>safeId(x.email)===key);if(!u)return;
  if(u.email===ADMIN){toast(t('mNoBlkOwner'),'err');return;}
  askConfirm(t('blkT'),t('blkM',{em:esc(u.email)}),t('okB'),true,async()=>{
    try{await db.collection('users').doc(u.email).update({status:'blocked'});log_('حجب حساب',u.email);toast(t('mUBlk'),'ok');}catch(e){toast(e.message,'err');}
  });
}
async function unblockUser(key){
  const u=Object.values(USRS).find(x=>safeId(x.email)===key);if(!u)return;
  try{await db.collection('users').doc(u.email).update({status:'active'});log_('رفع حجب حساب',u.email);toast(t('mUUn'),'ok');}catch(e){toast(e.message,'err');}
}
async function devAct(did,status){
  if(!busyGate())return;
  try{
    await db.collection('devices').doc(did).update({status:status,approvedAt:new Date(),approvedBy:ME.email});
    log_(status==='approved'?'اعتماد جهاز':'حظر جهاز',did+(DEVS[did]?(' — '+(DEVS[did].email||'')):''));
    toast(status==='approved'?t('mDApp'):t('mDBlk'),status==='approved'?'ok':'err');
  }catch(e){toast(e.message,'err');}
  busyRel();
}
function devDel(did){
  askConfirm(t('dDevT'),t('dDevM'),t('okB'),true,async()=>{
    if(!busyGate())return;
    try{await db.collection('devices').doc(did).delete();log_('حذف جهاز',did);toast(t('mDDel'),'ok');}catch(e){toast(e.message,'err');}
    busyRel();
  },t('wDel'));
}
function log_(action,detail){db.collection('logs').add({ts:new Date(),user:(ME&&ME.name)||'Admin',action:action||'',detail:detail||'',invNo:''});}

/* ===== بيانات الجهاز ===== */
async function deviceInfo(){
  const ua=navigator.userAgent;let dtype='💻 '+(LANG==='ar'?'كمبيوتر':'PC');
  if(/Android/i.test(ua))dtype='📱 Android';else if(/iPhone|iPad|iPod/i.test(ua))dtype='📱 iPhone/iPad';else if(/Mac/i.test(ua))dtype='💻 Mac';else if(/Linux/i.test(ua))dtype='💻 Linux';
  let br='Browser';if(/Edg\//.test(ua))br='Microsoft Edge';else if(/OPR\//.test(ua))br='Opera';else if(/Chrome\//.test(ua))br='Google Chrome';else if(/Firefox\//.test(ua))br='Firefox';else if(/Safari\//.test(ua))br='Safari';
  let os='OS';if(/Windows NT 10/.test(ua))os='Windows 10/11';else if(/Windows/.test(ua))os='Windows';else if(/Android/.test(ua)){const m=ua.match(/Android (\d+)/);os='Android '+(m?m[1]:'');}else if(/iPhone OS (\d+_\d+)/.test(ua))os='iOS '+ua.match(/iPhone OS (\d+_\d+)/)[1].replace('_','.');else if(/Mac OS X/.test(ua))os='macOS';else if(/Linux/.test(ua))os='Linux';
  const d={deviceType:dtype,browser:br,os:os,screen:screen.width+'×'+screen.height,lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'',cores:(navigator.hardwareConcurrency||0)+(LANG==='ar'?' نواة':' cores')};
  try{const r=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(5000)});const j=await r.json();d.ip=j.ip||'—';d.loc=(j.city?j.city+', ':'')+(j.country_name||'');d.isp=j.org||'—';}catch(e){d.ip='—';d.loc='—';d.isp='—';}
  return d;
}

/* ===== إقلاع ===== */
(async function(){
  applyTheme();applyLang();
  $('sndBtn').textContent=soundOn?'🔊':'🔇';
  const s=lsGet('ad_sess'),e=lsGet('ad_email');
  if(s==='1'&&e){
    showLoading(true);
    try{
      DID=getDeviceId();
      const dev=await db.collection('devices').doc(DID).get();
      if(dev.exists&&dev.data().status==='approved'&&dev.data().email===e){
        if(ADMIN&&e===ADMIN)await ensureAdminUser_(e);
        const u=await db.collection('users').doc(e).get();
        if(u.exists&&u.data().role==='admin'&&u.data().status!=='blocked'){
          ME={email:e,name:u.data().name||e.split('@')[0]};
          await db.collection('devices').doc(DID).update({lastUsed:new Date()});
          showLoading(false);openApp();return;
        }
      }
    }catch(err){}
    lsDel('ad_sess');lsDel('ad_email');showLoading(false);
  }
})();
